<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Content SEO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#FFF3D6; --surface:#FFFFFF; --surface-alt:#FCE7B0; --border:#E8C77E;
    --ink:#2B1B08; --ink-muted:#5C4322; --ink-faint:#8A6B3D;
    --accent:#F0AC2E; --accent-strong:#B9741A; --accent-soft:#F7C55C; --accent-ink:#2B1B08;
    --sidebar-bg:#0D0D0D; --sidebar-bg-alt:#1D1D1D; --sidebar-ink:#FFF3D6; --sidebar-muted:#C7B37E; --sidebar-border:#2B2B2B;
    --st-assigned:#A79A7D; --st-assigned-soft:#F2EEE3;
    --st-progress:#E8993D; --st-progress-soft:#FFF1DC;
    --st-review:#4FA3D1; --st-review-soft:#E7F4FB;
    --st-fix:#E1594C; --st-fix-soft:#FDE3E0;
    --st-fixed:#9370C9; --st-fixed-soft:#EFE7FB;
    --st-approved:#4FAE6D; --st-approved-soft:#E3F5E9;
    --danger:#C23B2E; --success:#3D8A4E;
    --shadow-sm:0 1px 3px rgba(58,36,8,.20);
    --shadow-md:0 10px 26px rgba(58,36,8,.24), 0 3px 8px rgba(58,36,8,.14);
    --radius:20px; --radius-sm:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0A0A0A; --surface:#161616; --surface-alt:#1F1F1F; --border:#333333;
      --ink:#F2EFE9; --ink-muted:#A3A3A3; --ink-faint:#7A7A7A;
      --accent:#FFCB4D; --accent-strong:#FFD873; --accent-soft:#4A3A1C; --accent-ink:#241A0E;
      --st-assigned:#B9AC8C; --st-assigned-soft:#332A1C;
      --st-progress:#F0A75A; --st-progress-soft:#3B2A15;
      --st-review:#74BEE6; --st-review-soft:#1B2E38;
      --st-fix:#E8836F; --st-fix-soft:#3A231D;
      --st-fixed:#B29AE0; --st-fixed-soft:#2E2740;
      --st-approved:#74C692; --st-approved-soft:#1E3527;
      --danger:#E8836F; --success:#74C692;
      --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 8px 24px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0A0A0A; --surface:#161616; --surface-alt:#1F1F1F; --border:#333333;
    --ink:#F2EFE9; --ink-muted:#A3A3A3; --ink-faint:#7A7A7A;
    --accent:#FFCB4D; --accent-strong:#FFD873; --accent-soft:#4A3A1C; --accent-ink:#241A0E;
    --st-assigned:#B9AC8C; --st-assigned-soft:#332A1C;
    --st-progress:#F0A75A; --st-progress-soft:#3B2A15;
    --st-review:#74BEE6; --st-review-soft:#1B2E38;
    --st-fix:#E8836F; --st-fix-soft:#3A231D;
    --st-fixed:#B29AE0; --st-fixed-soft:#2E2740;
    --st-approved:#74C692; --st-approved-soft:#1E3527;
    --danger:#E8836F; --success:#74C692;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 8px 24px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; color:var(--ink);
    background:
      radial-gradient(1000px 560px at 100% -12%, #FFE6A0 0%, transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:'Quicksand', system-ui, sans-serif;
    font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{ font-family:'Baloo 2', system-ui, sans-serif; text-wrap:balance; margin:0; }
  .num{ font-family:'Quicksand', sans-serif; font-weight:700; font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; }
  a{ color:var(--accent-strong); }
  :root[data-theme="dark"] a, @media (prefers-color-scheme:dark){ a{color:var(--accent);} }
  ::selection{ background:var(--accent-soft); }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--accent-strong); outline-offset:2px;
  }
  .scrollx{ overflow-x:auto; }

  /* ---------- layout shell ---------- */
  #app{ min-height:100vh; }
  .shell{ display:flex; min-height:100vh; }
  .sidebar{
    width:236px; flex:0 0 236px; background:var(--sidebar-bg); color:var(--sidebar-ink);
    display:flex; flex-direction:column; padding:20px 14px; gap:18px;
    position:sticky; top:0; height:100vh;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:0 6px; }
  .brand-mark{
    width:38px; height:38px; border-radius:50%; background:radial-gradient(circle at 35% 30%, var(--accent-soft), var(--accent) 65%);
    display:flex; align-items:center; justify-content:center; color:var(--accent-ink);
    flex:none; box-shadow:0 2px 0 var(--accent-strong);
  }
  .brand-mark svg{ width:26px; height:26px; }
  @keyframes bee-fly{
    0%,100%{ transform:translate(0,0) rotate(-4deg); }
    25%{ transform:translate(3px,-6px) rotate(3deg); }
    50%{ transform:translate(-2px,-2px) rotate(-2deg); }
    75%{ transform:translate(2px,-8px) rotate(4deg); }
  }
  @keyframes bee-wing{ 0%,100%{ transform:scaleY(1); } 50%{ transform:scaleY(.75); } }
  .flying-bee{ display:inline-flex; animation:bee-fly 2.6s ease-in-out infinite; transform-origin:center; }
  .flying-bee .wing{ transform-origin:center; animation:bee-wing .18s ease-in-out infinite; }
  .mascot-bee{ animation:bee-fly 3.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){
    .flying-bee, .flying-bee .wing, .mascot-bee{ animation:none !important; }
  }
  /* Honeycomb pattern as its own layer (::before) instead of opacity on the
     whole element — opacity on .login-wrap itself would fade the card, text,
     bees and pollen along with it, washing out the entire screen. */
  .honeycomb-bg{ position:relative; }
  .honeycomb-bg::before{
    content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(30deg, var(--accent-soft) 12%, transparent 12.5%, transparent 87%, var(--accent-soft) 87.5%, var(--accent-soft)),
      linear-gradient(150deg, var(--accent-soft) 12%, transparent 12.5%, transparent 87%, var(--accent-soft) 87.5%, var(--accent-soft)),
      linear-gradient(30deg, var(--accent-soft) 12%, transparent 12.5%, transparent 87%, var(--accent-soft) 87.5%, var(--accent-soft)),
      linear-gradient(150deg, var(--accent-soft) 12%, transparent 12.5%, transparent 87%, var(--accent-soft) 87.5%, var(--accent-soft)),
      linear-gradient(60deg, var(--accent-soft) 25%, transparent 25.5%, transparent 75%, var(--accent-soft) 75%, var(--accent-soft)),
      linear-gradient(60deg, var(--accent-soft) 25%, transparent 25.5%, transparent 75%, var(--accent-soft) 75%, var(--accent-soft));
    background-size:44px 76px;
    background-position:0 0, 0 0, 22px 38px, 22px 38px, 0 0, 22px 38px;
    opacity:.35;
  }
  .empty-col{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .empty-col svg{ width:30px; height:30px; opacity:.8; }
  .brand-name{ font-family:'Archivo',sans-serif; font-weight:700; font-size:15.5px; line-height:1.2; }
  .brand-sub{ font-size:11px; color:var(--sidebar-muted); }
  nav.mainnav{ display:flex; flex-direction:column; gap:2px; margin-top:4px; }
  .navlink{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:16px;
    color:var(--sidebar-muted); text-decoration:none; font-size:13.5px; font-weight:500;
    cursor:pointer; border:none; background:none; text-align:left; width:100%;
  }
  .navlink svg{ flex:none; opacity:.9; }
  .navlink:hover{ background:var(--sidebar-bg-alt); color:var(--sidebar-ink); }
  .navlink.active{ background:var(--accent); color:var(--accent-ink); font-weight:600; }
  .sidebar-spacer{ flex:1; }
  .sidebar-card{
    background:var(--sidebar-bg-alt); border:1px solid var(--sidebar-border); border-radius:var(--radius-sm);
    padding:12px; display:flex; flex-direction:column; gap:8px;
  }
  .who{ display:flex; align-items:center; gap:9px; }
  .avatar{
    width:32px; height:32px; border-radius:50%; background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; flex:none;
    box-shadow:0 2px 0 var(--accent-strong);
    font-family:'Baloo 2',sans-serif;
  }
  .who-name{ font-size:13px; font-weight:600; color:var(--sidebar-ink); }
  .who-role{ font-size:11px; color:var(--sidebar-muted); }
  .logout-btn{
    font-size:12px; color:var(--sidebar-muted); background:none; border:1px solid var(--sidebar-border);
    border-radius:12px; padding:6px 8px; cursor:pointer; width:100%;
  }
  .logout-btn:hover{ color:var(--sidebar-ink); border-color:var(--sidebar-muted); }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:18px 28px; border-bottom:1px solid var(--border); background:var(--surface);
    position:sticky; top:0; z-index:5;
  }
  .topbar h1{ font-size:19px; }
  .topbar .sub{ font-size:12.5px; color:var(--ink-muted); margin-top:2px; }
  .page{ padding:24px 28px 60px; flex:1; }
  .page-inner{ max-width:1180px; }

  .banner{
    display:flex; align-items:flex-start; gap:12px; padding:13px 16px; border-radius:var(--radius-sm);
    background:var(--st-review-soft); border:1px solid var(--st-review); color:var(--ink); margin-bottom:20px;
  }
  .banner strong{ color:var(--st-review); }
  .banner .x{ margin-left:auto; background:none; border:none; cursor:pointer; color:var(--ink-muted); font-size:16px; line-height:1; }
  .banner.info{ background:var(--st-progress-soft); border-color:var(--st-progress); }
  .banner.info strong{ color:var(--st-progress); }
  .banner .banner-btn{
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:999px; padding:6px 12px;
    font-size:12.5px; font-weight:600; cursor:pointer; flex:none;
  }

  /* ---------- buttons / inputs ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); font-size:13px; font-weight:700; cursor:pointer;
    font-family:'Quicksand',sans-serif; transition:transform .12s ease;
  }
  .btn:hover{ border-color:var(--ink-faint); }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--accent); border-color:var(--accent-strong); color:var(--accent-ink); box-shadow:0 2.5px 0 var(--accent-strong); }
  .btn-primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }
  .btn-primary:active{ box-shadow:0 0.5px 0 var(--accent-strong); transform:translateY(2px); }
  .btn-ghost{ background:none; border-color:transparent; }
  .btn-ghost:hover{ background:var(--surface-alt); border-color:transparent; }
  .btn-danger{ color:var(--danger); }
  .btn-sm{ padding:6px 13px; font-size:12px; border-radius:999px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:12px; font-weight:600; color:var(--ink-muted); }
  .field input, .field select, .field textarea{
    padding:9px 12px; border-radius:14px; border:1px solid var(--border); background:var(--surface);
    color:var(--ink); font-size:13.5px; font-family:inherit; width:100%;
  }
  .field textarea{ resize:vertical; min-height:70px; }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--accent-strong); }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .form-grid.full{ grid-template-columns:1fr; }

  /* ---------- pills / badges ---------- */
  .pill{
    display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:100px;
    font-size:11.5px; font-weight:700; white-space:nowrap;
  }
  .pill::before{ content:''; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .pill-assigned{ background:var(--st-assigned-soft); color:var(--st-assigned); }
  .pill-in_progress{ background:var(--st-progress-soft); color:var(--st-progress); }
  .pill-review{ background:var(--st-review-soft); color:var(--st-review); }
  .pill-fix{ background:var(--st-fix-soft); color:var(--st-fix); }
  .pill-fixed{ background:var(--st-fixed-soft); color:var(--st-fixed); }
  .pill-approved{ background:var(--st-approved-soft); color:var(--st-approved); }
  .tag{
    display:inline-flex; padding:2px 9px; border-radius:10px; font-size:11px; font-weight:700;
    background:var(--surface-alt); color:var(--ink-muted); border:1px solid var(--border);
  }
  .tag.new{ color:var(--accent-strong); border-color:var(--accent); background:var(--accent-soft); }
  .role-badge{ font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:10px; text-transform:uppercase; letter-spacing:.03em; }
  .role-admin{ background:var(--st-fix-soft); color:var(--st-fix); }
  .role-manager{ background:var(--st-progress-soft); color:var(--st-progress); }
  .role-intern{ background:var(--st-approved-soft); color:var(--st-approved); }

  /* ---------- stat cards ---------- */
  .stat-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(175px,1fr)); gap:14px; margin-bottom:22px; }
  .stat-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px;
    display:flex; flex-direction:column; gap:6px; box-shadow:var(--shadow-sm);
  }
  .stat-card .label{ font-size:12px; color:var(--ink-muted); font-weight:600; }
  .stat-card .value{ font-size:28px; font-weight:800; font-family:'Baloo 2',sans-serif; }
  .stat-card .value.accent{ color:var(--accent-strong); }
  .stat-card .value.danger{ color:var(--danger); }
  .stat-card .value.success{ color:var(--success); }
  .stat-card .delta{ font-size:11.5px; color:var(--ink-faint); }

  /* ---------- filter bar ---------- */
  .filter-bar{
    display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; margin-bottom:18px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px;
  }
  .filter-bar .field{ min-width:150px; flex:1 1 150px; }
  .filter-bar .field.grow-search{ flex:2 1 220px; }

  /* ---------- kanban ---------- */
  .board{ display:flex; gap:14px; align-items:flex-start; padding-bottom:8px; }
  .board-col{ flex:0 0 264px; width:264px; }
  .board-col-head{ display:flex; align-items:center; gap:8px; padding:0 4px 10px; }
  .board-col-head .dot{ width:9px; height:9px; border-radius:50%; }
  .board-col-head h3{ font-size:13px; }
  .board-col-head .count{ margin-left:auto; font-size:12px; color:var(--ink-muted); font-family:'Quicksand',sans-serif; }
  .board-col-body{ display:flex; flex-direction:column; gap:10px; min-height:40px; }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:13px;
    box-shadow:var(--shadow-sm); cursor:pointer; display:flex; flex-direction:column; gap:8px;
  }
  .card:hover{ border-color:var(--ink-faint); box-shadow:var(--shadow-md); }
  .card-top{ display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
  .card-title{ font-size:13.5px; font-weight:600; line-height:1.35; }
  .card-meta{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .card-assignee{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-muted); }
  .card-assignee .avatar{ width:20px; height:20px; font-size:9.5px; }
  .card-deadline{ font-size:11.5px; font-family:'Quicksand',sans-serif; color:var(--ink-faint); }
  .card-deadline.overdue{ color:var(--danger); font-weight:700; }
  .empty-col{ font-size:12px; color:var(--ink-faint); padding:14px 4px; text-align:center; border:1px dashed var(--border); border-radius:14px; }

  /* ---------- modal ---------- */
  .modal-bg{
    position:fixed; inset:0; background:rgba(15,22,20,.5); display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:50;
  }
  .modal{
    background:var(--surface); border-radius:var(--radius); width:100%; max-width:560px; max-height:90vh; overflow-y:auto;
    box-shadow:var(--shadow-md); border:1px solid var(--border);
  }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border); }
  .modal-head h2{ font-size:16.5px; }
  .modal-close{ background:none; border:none; font-size:19px; cursor:pointer; color:var(--ink-muted); line-height:1; }
  .modal-body{ padding:20px 22px; display:flex; flex-direction:column; gap:16px; }
  .modal-foot{ padding:16px 22px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; }
  .detail-row{ display:flex; gap:14px; font-size:13px; }
  .detail-row .k{ width:110px; flex:none; color:var(--ink-muted); font-weight:600; }
  .detail-row .v{ flex:1; }
  .history{ display:flex; flex-direction:column; gap:8px; }
  .history-item{ display:flex; gap:10px; font-size:12.5px; }
  .history-item .t{ color:var(--ink-faint); font-family:'Quicksand',sans-serif; flex:none; width:74px; }

  /* ---------- login (matches approved demo design) ---------- */
  .login-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    position:relative; z-index:1;
    background:
      radial-gradient(1100px 700px at 15% -10%, #FFE6A0 0%, transparent 60%),
      radial-gradient(900px 600px at 110% 10%, #FFD27A 0%, transparent 55%),
      linear-gradient(160deg, var(--bg) 0%, var(--accent-soft) 130%);
  }
  .login-scene{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
  .login-card{
    width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border); border-radius:22px;
    padding:34px 32px 30px; box-shadow:var(--shadow-md); position:relative; z-index:1;
  }
  .corner-bee{
    position:absolute; top:-20px; right:16px; font-size:34px;
    animation:cornerFloat 3.2s ease-in-out infinite;
    filter:drop-shadow(0 4px 8px rgba(58,36,8,.35));
  }
  @keyframes cornerFloat{ 0%,100%{ transform:translateY(0) rotate(-4deg); } 50%{ transform:translateY(-8px) rotate(4deg); } }
  .login-brand{ display:flex; align-items:center; gap:14px; margin-bottom:26px; }
  .brand-badge{
    width:52px; height:52px; border-radius:16px; flex:none; font-size:26px;
    background:linear-gradient(145deg, var(--accent), var(--accent-strong));
    display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 -3px 6px rgba(58,36,8,.25), 0 6px 14px -4px rgba(185,116,26,.6);
  }
  .login-brand .brand-name{ font-family:'Fredoka',sans-serif; font-size:20px; font-weight:700; letter-spacing:.02em; color:var(--ink); }
  .login-brand .brand-sub{ margin-top:3px; font-size:13px; color:var(--ink-muted); font-weight:600; }
  .login-title{ font-family:'Fredoka',sans-serif; font-size:24px; font-weight:600; color:var(--ink); margin-bottom:8px; }
  .login-sub{ font-size:13.5px; color:var(--ink-muted); line-height:1.5; margin-bottom:22px; }
  .login-form{ display:flex; flex-direction:column; }
  .login-form .field{ margin-bottom:16px; }
  .login-form label{
    display:block; font-size:12.5px; font-weight:700; color:var(--accent-strong);
    margin-bottom:6px; text-transform:uppercase; letter-spacing:.03em;
  }
  .login-form input[type=text], .login-form input[type=password]{
    width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--border);
    background:var(--bg); font-size:14.5px; color:var(--ink); font-weight:500;
    outline:none; transition:border-color .15s, box-shadow .15s;
  }
  .login-form input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(240,172,46,.28); }
  .login-error{ font-size:12.5px; color:var(--danger); min-height:1px; }
  .btn-login-fancy{
    width:100%; margin-top:10px; padding:13px 14px; border:none; border-radius:14px;
    background:linear-gradient(135deg, var(--accent), var(--accent-strong)); color:#fff;
    font-weight:700; font-size:15px; letter-spacing:.01em; cursor:pointer;
    box-shadow:0 10px 22px -8px rgba(185,116,26,.65); transition:transform .15s, box-shadow .15s;
    font-family:'Quicksand',sans-serif;
  }
  .btn-login-fancy:hover{ transform:translateY(-1px); box-shadow:0 14px 26px -8px rgba(185,116,26,.75); }
  .btn-login-fancy:disabled{ opacity:.6; cursor:not-allowed; }
  @media (prefers-reduced-motion: reduce){ .corner-bee{ animation:none !important; } }
  .pollen-drift{
    position:absolute; bottom:-20px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #FFF3CE, var(--accent) 55%, transparent 75%);
    opacity:0; filter:blur(.2px);

  /* ---------- overdue table rows ---------- */

  /* ---------- reports: donut ---------- */
  .donut-row{ display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
  .donut{ width:150px; height:150px; border-radius:50%; flex:none; position:relative; }
  .donut::after{ content:''; position:absolute; inset:22px; border-radius:50%; background:var(--surface); }
  .donut-legend{ display:flex; flex-direction:column; gap:8px; }

  .stack-chart{ display:flex; align-items:flex-end; gap:14px; height:180px; padding:0 4px; }

</style>

<body>
<div id="app"></div>

<script>
/* ============================= CONSTANTS ============================= */
const STATUS_META = {
  assigned:{label:'Giao việc', short:'Giao việc'},
  in_progress:{label:'Đang thực hiện', short:'Đang làm'},
  review:{label:'Đợi duyệt', short:'Đợi duyệt'},
  approved:{label:'Đã duyệt', short:'Đã duyệt'},
};
const STATUS_ORDER = ['assigned','in_progress','review','approved'];
// Manager/Admin duyệt hoặc từ chối ngay từ trạng thái "Đợi duyệt" — không
// còn "Cần sửa"/"Đã sửa" riêng, từ chối sẽ đưa task quay lại "Đang thực
// hiện" để nhân sự sửa rồi nộp lại (cũng là in_progress → review).
const PENDING_REVIEW_STATUSES = ['review'];
const TYPE_META = {
  New:   {label:'New',  cls:'new'},
  Audit: {label:'Audit',cls:'audit'},
  Other: {label:'Khác', cls:'other'},
};
const TYPE_ORDER = ['New','Audit','Other'];
const MONTH_NAMES = ['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
const BACKLOG_PAGE_SIZE = 10;

/* ============================= DATA LAYER (persisted via Artifact db) ============================= */
let USERS = [];
let TASKS = [];
let SCHEDULE = {};      // userId -> {iso: {morning, afternoon, status, reason, submittedAt}}
let LEAVE_REQUESTS = [];
let NOTIFICATIONS = [];
let dbApi = null;

/* ============================= STATE ============================= */
let state = {
  authedUser:null,
  page:'tasks',
  taskFilters:{q:'', status:'', assignedBy:'', assignee:'', deadlineFrom:'', deadlineTo:'', type:''},
  taskTab:'current',        // 'current' | 'backlog'
  taskWeekMonday:null,      // ISO date of the Monday being viewed on the "current week" tab (set on init)
  backlogPage:1,
  openTaskId:null,
  showTaskForm:false,
  editTaskModal:null,      // taskId being edited, or null
  calDayViewModal:null,    // {date} — read-only "who's working this day" summary (managers)
  calMonth:new Date().getMonth(), calYear:new Date().getFullYear(),
  bannerDismissed:false,
  loginError:'',
  submitModal:null,   // {taskId, mode:'submit'|'resubmit'}
  fixModal:null,      // {taskId}
  confirmModal:null,  // {title, message, confirmLabel, onConfirm, payload}
  calDayModal:null,   // {date}
  personModal:false,
  editPersonModal:null, // {uid, name, title, email}
  resetPwModal:null,  // {uid, name}
  bulkPersonModal:false,
  bulkRows:[],        // [{name, role, title, username, password, email}]
  bulkResult:null,    // {successCount, errors:[string]}
  bulkTaskModal:false,
  bulkTaskRows:[],      // [{keyword, type, assignee, deadline, desc, _rawName}]
  bulkTaskPaste:'',     // nội dung ô dán nhanh
  bulkTaskResult:null,  // {successCount, errors:[string]}
  notifOpen:false,
  reportsRange:'this_week', // 'this_week'|'last_week'|'this_month'|'last_month'|'custom'
  reportsCustomFrom:'', reportsCustomTo:'',
  reportsPerson:'', // '' = tất cả nhân sự, hoặc uid 1 người cụ thể để lọc báo cáo
};

/* ============================= HELPERS ============================= */
function pad2(n){ return String(n).padStart(2,'0'); }
function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function todayDMY(){ const d=new Date(); return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}`; }
function nowISOTime(){ return new Date().toISOString(); }
function isOverdue(iso, status){ return status!=='approved' && iso < todayISO(); }
function overdueDays(iso){ const a=new Date(iso), b=new Date(todayISO()); return Math.max(0, Math.round((b-a)/86400000)); }
function byId(id){ return USERS.find(u=>u.id===id) || {id, name:'(đã xoá)', role:'intern', title:''}; }
function roleLabel(r){ return r==='admin'?'Quản trị':r==='manager'?'Quản lý':'Thực tập sinh'; }
function initials(name){ const p=(name||'?').trim().split(' '); return (p[p.length-2]?.[0]||'')+(p[p.length-1]?.[0]||''); }
function fmtDate(iso){ const parts=(iso||'').split('-'); if(parts.length<3) return iso||''; const [y,m,d]=parts; return `${d}/${m}`; }
function fmtDateFull(iso){ const parts=(iso||'').split('-'); if(parts.length<3) return iso||''; const [y,m,d]=parts; return `${d}/${m}/${y}`; }
function fmtDateTime(iso){ try{ const d=new Date(iso); return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }catch(e){ return ''; } }
function isManagerOrAdmin(u){ return u && (u.role==='admin'||u.role==='manager'); }
function taskLabel(t){ return 'T-' + String(t.taskNo!=null ? t.taskNo : String(t.id).slice(-5)).padStart(4,'0'); }
// Đồng bộ TOÀN BỘ thông tin task sang Google Sheet — mỗi task giữ đúng 1
// dòng, được ghi lần đầu lúc "Đợi duyệt" rồi CẬP NHẬT lại đúng dòng đó ở
// những lần sau (nộp lại sau khi bị yêu cầu sửa, và lúc "Đã duyệt") — xử lý
// gộp dòng do Edge Function push-to-sheet đảm nhiệm qua cột tasks.sheet_row,
// ở đây chỉ cần enqueue best-effort, không bao giờ được chặn luồng chính.
async function enqueueSheetSync(t, statusLabel, extraNote){
  const assignedByUser = byId(t.assignedBy);
  const assigneeUser = byId(t.assignee);
  try{
    await dbApi.collection('sheetQueue').add({
      taskId:t.id, taskLabel:taskLabel(t), taskKeyword:t.keyword, link:t.fileLink||'',
      employeeId:t.assignee, employeeName:assigneeUser.name,
      submittedAt: nowISOTime(),
      payload: {
        submittedAt: nowISOTime(),
        keyword: t.keyword,
        type: TYPE_META[t.type] ? TYPE_META[t.type].label : (t.type||''),
        employeeName: assigneeUser.name,
        assignedByName: assignedByUser ? assignedByUser.name : '',
        createdAt: t.createdAt,
        deadline: t.deadline,
        statusLabel: statusLabel,
        link: t.fileLink || '',
        desc: t.desc || '',
        note: extraNote || t.note || '',
      },
    });
  }catch(err){ /* queueing best-effort; the task update that triggered this already succeeded */ }
}
function escapeHtml(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function linkify(s){ return s.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }
function defaultDeadline(){ const d=new Date(); d.setDate(d.getDate()+7); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function getNextWeekDates(){
  const now = new Date();
  const dow = now.getDay()===0 ? 7 : now.getDay(); // 1..7 Mon..Sun
  const thisMonday = new Date(now); thisMonday.setDate(now.getDate()-(dow-1));
  const nextMonday = new Date(thisMonday); nextMonday.setDate(thisMonday.getDate()+7);
  const dates=[];
  for(let i=0;i<7;i++){ const d=new Date(nextMonday); d.setDate(nextMonday.getDate()+i); dates.push(`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`); }
  return dates;
}

/* ---- ISO week helpers (must match Postgres to_char(x,'IYYY"-W"IW')) ---- */
function mondayOf(dateOrIso){
  const d = typeof dateOrIso==='string' ? new Date(dateOrIso+'T00:00:00') : new Date(dateOrIso);
  const dow = d.getDay()===0 ? 7 : d.getDay();
  const m = new Date(d); m.setDate(d.getDate()-(dow-1)); m.setHours(0,0,0,0);
  return `${m.getFullYear()}-${pad2(m.getMonth()+1)}-${pad2(m.getDate())}`;
}
function addDaysISO(iso, n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function isoWeekId(iso){
  const d = new Date(Date.UTC(Number(iso.slice(0,4)), Number(iso.slice(5,7))-1, Number(iso.slice(8,10))));
  const day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  const weekNo = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
  return `${d.getUTCFullYear()}-W${pad2(weekNo)}`;
}
function currentWeekMonday(){ return mondayOf(todayISO()); }
function weekRangeLabel(mondayIso){ return `${fmtDate(mondayIso)} – ${fmtDate(addDaysISO(mondayIso,6))}`; }

/* ---- thin Firestore-shaped wrapper over Supabase Postgres tables ---- */
/* Keeps every dbApi.collection(x).doc(id).set/update/delete()/.add() call
   site below unchanged from the original design — only this adapter and
   the subscription wiring differ between backends. */
const FIELD_MAP = {
  tasks:   { keyword:'keyword', type:'type', assignee:'assignee', assignedBy:'assigned_by', deadline:'deadline', createdAt:'created_at', status:'status', fileLink:'file_link', desc:'description', note:'note', history:'history', comments:'comments', taskNo:'task_no', weekId:'week_id' },
  users:   { name:'name', role:'role', title:'title', username:'username', joined:'joined', email:'email' },
  schedule:{ days:'days' },
  leaveRequests: { userId:'user_id', date:'date', reason:'reason', status:'status' },
  sheetQueue:    { taskId:'task_id', taskLabel:'task_label', taskKeyword:'task_keyword', link:'link', employeeId:'employee_id', employeeName:'employee_name', submittedAt:'submitted_at', payload:'payload' },
  notifications: { userId:'user_id', title:'title', body:'body', createdAt:'created_at', readAt:'read_at' },
};
const TABLE_NAME = { tasks:'tasks', users:'profiles', schedule:'schedule', leaveRequests:'leave_requests', sheetQueue:'sheet_queue', notifications:'notifications' };
const ID_COLUMN  = { tasks:'id', users:'id', schedule:'user_id', leaveRequests:'id', sheetQueue:'id', notifications:'id' };

function toRow(coll, data){
  const map = FIELD_MAP[coll]; const row = {};
  Object.keys(data||{}).forEach(k=>{ const col = map[k]; if(col) row[col] = data[k]; });
  return row;
}
function fromRow(coll, row){
  if(!row) return null;
  const map = FIELD_MAP[coll]; const out = {};
  Object.keys(map).forEach(k=>{ const col = map[k]; if(row[col]!==undefined) out[k] = row[col]; });
  return out;
}
function newId(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id'+Date.now()+Math.random().toString(36).slice(2)); }

function createSupabaseDbApi(){
  function collection(coll){
    const table = TABLE_NAME[coll], idCol = ID_COLUMN[coll];
    return {
      doc(id){
        const docId = id || newId();
        return {
          id: docId,
          async get(){
            const { data } = await sb.from(table).select('*').eq(idCol, docId).maybeSingle();
            return { id:docId, exists:!!data, data:()=>fromRow(coll, data) };
          },
          async set(data){
            const row = { [idCol]: docId, ...toRow(coll, data) };
            const { error } = await sb.from(table).upsert(row, { onConflict: idCol });
            if(error) throw error;
          },
          async update(data){
            const { error } = await sb.from(table).update(toRow(coll, data)).eq(idCol, docId);
            if(error) throw error;
          },
          async delete(){
            const { error } = await sb.from(table).delete().eq(idCol, docId);
            if(error) throw error;
          },
        };
      },
      async add(data){
        const docId = newId();
        const row = { [idCol]: docId, ...toRow(coll, data) };
        const { error } = await sb.from(table).insert(row);
        if(error) throw error;
        return { id: docId };
      },
    };
  }
  return { collection };
}
dbApi = createSupabaseDbApi();

/* ============================= INIT / SYNC ============================= */
/* Unlike Firestore, Row Level Security here filters rows rather than
   rejecting an unconstrained query outright — so every role can safely
   subscribe to the whole table and simply receive fewer rows back. No
   role-scoped queries needed. */
let authReady = false;
let profileReady = false;
let currentSession = null;
let realtimeChannels = [];

function stopDataSubscriptions(){
  realtimeChannels.forEach(ch=>{ try{ sb.removeChannel(ch); }catch(e){} });
  realtimeChannels = [];
  USERS = []; TASKS = []; SCHEDULE = {}; LEAVE_REQUESTS = []; NOTIFICATIONS = [];
}

async function refreshUsers(){ const { data } = await sb.from('profiles').select('*'); USERS = (data||[]).map(r=>({ id:r.id, ...fromRow('users', r) })); }
async function refreshTasks(){ const { data } = await sb.from('tasks').select('*'); TASKS = (data||[]).map(r=>({ id:r.id, ...fromRow('tasks', r) })); }
async function refreshSchedule(){ const { data } = await sb.from('schedule').select('*'); const next={}; (data||[]).forEach(r=>{ next[r.user_id] = r.days||{}; }); SCHEDULE = next; }
async function refreshLeave(){ const { data } = await sb.from('leave_requests').select('*'); LEAVE_REQUESTS = (data||[]).map(r=>({ id:r.id, ...fromRow('leaveRequests', r) })); }
async function refreshNotifications(){
  const { data } = await sb.from('notifications').select('*').order('created_at', {ascending:false}).limit(50);
  NOTIFICATIONS = (data||[]).map(r=>({ id:r.id, ...fromRow('notifications', r) }));
}

function subscribeTable(table, onChange){
  const channel = sb.channel(`realtime:${table}:${Math.random().toString(36).slice(2)}`)
    .on('postgres_changes', { event:'*', schema:'public', table }, onChange)
    .subscribe();
  realtimeChannels.push(channel);
}

function startDataSubscriptions(){
  refreshUsers().then(render);
  refreshTasks().then(render);
  refreshSchedule().then(render);
  refreshLeave().then(render);
  refreshNotifications().then(render);
  subscribeTable('profiles',       ()=>refreshUsers().then(render));
  subscribeTable('tasks',          ()=>refreshTasks().then(render));
  subscribeTable('schedule',       ()=>refreshSchedule().then(render));
  subscribeTable('leave_requests', ()=>refreshLeave().then(render));
  subscribeTable('notifications',  ()=>refreshNotifications().then(render));
}

function initApp(){
  sb.auth.onAuthStateChange(async (event, session)=>{
    const prevUid = (currentSession && currentSession.user) ? currentSession.user.id : null;
    const newUid = (session && session.user) ? session.user.id : null;
    authReady = true;
    currentSession = session;
    if(prevUid===newUid && event!=='INITIAL_SESSION' && event!=='SIGNED_IN'){
      render(); // e.g. TOKEN_REFRESHED for the same user — nothing to redo
      return;
    }
    resetUiState();
    stopDataSubscriptions();
    if(newUid){
      profileReady = false;
      await loadProfileFor(newUid);
      if(state.authedUser) startDataSubscriptions();
      render();
    } else {
      profileReady = false;
      state.authedUser = null;
      render();
    }
  });
}

/* Ambient bee + pollen scene on the login screen. Uses a real wander/dash/
   hover steering simulation (not a fixed CSS loop) so the flight never
   repeats. Self-terminates once #loginScene is no longer in the document
   (e.g. after a successful login re-renders the shell instead). */
function initLoginScene(){
  const scene = document.getElementById('loginScene');
  if(!scene) return;
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduceMotion) return;

  const POLLEN_COUNT = 22;
  for(let i=0;i<POLLEN_COUNT;i++){
    const p = document.createElement('span');
    p.className = 'pollen-drift';
    const size = 4 + Math.random()*6;
    p.style.width = size+'px'; p.style.height = size+'px';
    p.style.left = (Math.random()*100)+'vw';
    p.style.setProperty('--drift', (Math.random()*80-40)+'px');
    const dur = 9 + Math.random()*10;
    p.style.animationDuration = dur+'s';
    p.style.animationDelay = (Math.random()*dur)+'s';
    scene.appendChild(p);
  }

  const N_BEES = 4;
  const bees = [];
  for(let i=0;i<N_BEES;i++){
    const agent = document.createElement('div'); agent.className = 'bee-agent';
    const tilt = document.createElement('div'); tilt.className = 'bee-tilt';
    const wing = document.createElement('span'); wing.className = 'bee-wing'; wing.textContent = '🐝';
    wing.style.animationDuration = (0.09 + Math.random()*0.05) + 's';
    tilt.appendChild(wing); agent.appendChild(tilt); scene.appendChild(agent);

    const homeX = window.innerWidth * (0.1 + Math.random()*0.8);
    const homeY = window.innerHeight * (0.08 + Math.random()*0.7);
    bees.push({
      agent, tilt, x:homeX, y:homeY,
      vx:(Math.random()*2-1)*30, vy:(Math.random()*2-1)*30,
      homeX, homeY, roam:220+Math.random()*160,
      wanderAngle:Math.random()*Math.PI*2, baseSpeed:55+Math.random()*35,
      hoverUntil:0, dashUntil:0, nextDecisionAt:0,
    });
  }

  let lastT = performance.now();
  function tick(now){
    if(!scene.isConnected) return; // login page left — stop the loop for good
    const dt = Math.min(0.05, (now-lastT)/1000); lastT = now;
    for(const b of bees){
      if(now > b.nextDecisionAt){
        const roll = Math.random();
        if(roll < 0.35) b.hoverUntil = now + 450 + Math.random()*750;
        else if(roll < 0.6) b.dashUntil = now + 280 + Math.random()*380;
        b.nextDecisionAt = now + 900 + Math.random()*1400;
      }
      let targetSpeed = b.baseSpeed;
      if(now < b.hoverUntil) targetSpeed = b.baseSpeed*0.1;
      else if(now < b.dashUntil) targetSpeed = b.baseSpeed*2.6;

      b.wanderAngle += (Math.random()-0.5)*5.5*dt;
      let steerX = Math.cos(b.wanderAngle), steerY = Math.sin(b.wanderAngle);

      const dxHome = b.x-b.homeX, dyHome = b.y-b.homeY;
      const distHome = Math.hypot(dxHome,dyHome);
      if(distHome > b.roam){
        const backAngle = Math.atan2(-dyHome,-dxHome);
        const pull = Math.min(1,(distHome-b.roam)/140);
        steerX = steerX*(1-pull)+Math.cos(backAngle)*pull;
        steerY = steerY*(1-pull)+Math.sin(backAngle)*pull;
      }
      const desiredVx = steerX*targetSpeed, desiredVy = steerY*targetSpeed;
      const ease = Math.min(1, dt*(now<b.dashUntil?5:2.6));
      b.vx += (desiredVx-b.vx)*ease; b.vy += (desiredVy-b.vy)*ease;
      b.x += b.vx*dt; b.y += b.vy*dt;
      b.x = Math.max(16, Math.min(window.innerWidth-16, b.x));
      b.y = Math.max(16, Math.min(window.innerHeight-16, b.y));

      const flip = b.vx < 0 ? -1 : 1;
      const pitch = Math.max(-24, Math.min(24, b.vy*0.32)) * flip;
      b.agent.style.transform = `translate(${b.x}px, ${b.y}px)`;
      b.tilt.style.transform = `scaleX(${flip}) rotate(${pitch}deg)`;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* ============================= TASKS PAGE ============================= */
function getTaskById(id){ return TASKS.find(t=>t.id===id); }
function applyCommonFilters(list, u){
  const f = state.taskFilters;
  if(u.role==='intern') list = list.filter(t=>t.assignee===u.id);
  if(f.q){
    const q = f.q.toLowerCase();
    list = list.filter(t=>(t.keyword||'').toLowerCase().includes(q) || taskLabel(t).toLowerCase().includes(q));
  }
  if(f.status) list = list.filter(t=>t.status===f.status);
  if(f.type) list = list.filter(t=>t.type===f.type);
  if(f.assignedBy) list = list.filter(t=>t.assignedBy===f.assignedBy);
  if(f.assignee) list = list.filter(t=>t.assignee===f.assignee);
  if(f.deadlineFrom) list = list.filter(t=>t.deadline>=f.deadlineFrom);
  if(f.deadlineTo) list = list.filter(t=>t.deadline<=f.deadlineTo);
  return list;
}
// "Tuần hiện tại" (or whichever week is being browsed): tasks whose week_id
// matches the viewed week — this is the week the task was GIAO VIỆC in,
// fixed forever, never auto-migrates.
function currentWeekTasks(u, weekMonday){
  const weekId = isoWeekId(weekMonday);
  return applyCommonFilters(TASKS.filter(t=>t.weekId===weekId), u).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
}
// "Tồn đọng": task thuộc các tuần trước, chưa Đã duyệt — bất kể đang xem tuần nào.
function backlogTasks(u){
  const thisWeekId = isoWeekId(currentWeekMonday());
  return applyCommonFilters(TASKS.filter(t=>t.weekId!==thisWeekId && t.status!=='approved'), u)
    .sort((a,b)=>(a.deadline||'').localeCompare(b.deadline||''));
}
function renderTasksPage(u){
  if(!state.taskWeekMonday) state.taskWeekMonday = currentWeekMonday();
  const managers = USERS.filter(x=>x.role==='manager'||x.role==='admin');
  const interns = USERS.filter(x=>x.role==='intern');
  // Ai cũng có thể tự tạo task giao cho chính mình (kể cả Admin/Manager), nên
  // 2 bộ lọc "Người giao việc" / "Người thực hiện" phải liệt kê TOÀN BỘ nhân

  const allPeople = USERS.slice().sort((a,b)=>a.name.localeCompare(b.name));

  const weekList = currentWeekTasks(u, state.taskWeekMonday);
  const backlogList = backlogTasks(u);
  const activeList = state.taskTab==='backlog' ? backlogList : weekList;

  const inProgressCount = activeList.filter(t=>['in_progress','review'].includes(t.status)).length;
  const reviewCount = activeList.filter(t=>PENDING_REVIEW_STATUSES.includes(t.status)).length;
  const overdueCount = activeList.filter(t=>isOverdue(t.deadline,t.status)).length;

  const pageSize = BACKLOG_PAGE_SIZE;
  const totalPages = Math.max(1, Math.ceil(backlogList.length/pageSize));
  const backlogPage = Math.min(state.backlogPage, totalPages);

      <div class="stat-card"><div class="label">Trễ deadline</div><div class="value ${overdueCount>0?'danger':''} num">${overdueCount}</div></div>

    <div class="section-title">

    <div class="tabbar">
      <button class="tab-btn ${state.taskTab==='current'?'active':''}" data-tasktab="current">Tuần hiện tại<span class="tab-count">${weekList.length}</span></button>

    </div>

    ${state.taskTab==='current' ? `
    <div class="weeknav">
      <button class="btn btn-ghost btn-sm" data-action="weekPrev">◀</button>
      <div><div class="lbl">Tuần ${isoWeekId(state.taskWeekMonday).split('-W')[1]} · ${weekRangeLabel(state.taskWeekMonday)}</div>
        <div class="sub">${state.taskWeekMonday===currentWeekMonday()?'Tuần hiện tại':'Đang xem tuần khác'}</div></div>
      <button class="btn btn-ghost btn-sm" data-action="weekNext">▶</button>
      ${state.taskWeekMonday!==currentWeekMonday() ? `<button class="btn btn-ghost btn-sm" data-action="weekToday">Về tuần này</button>` : ''}
      <div class="field" style="margin-left:auto;min-width:170px;"><label>Đi tới ngày bất kỳ</label><input type="date" id="weekJump" value="${state.taskWeekMonday}"></div>

    <div class="filter-bar">

      ${u.role!=='intern' ? `<div class="field"><label>Người thực hiện</label><select id="fAssignee"><option value="">Tất cả</option>${allPeople.map(m=>`<option value="${m.id}" ${state.taskFilters.assignee===m.id?'selected':''}>${m.name}</option>`).join('')}</select></div>` : ''}
      <div class="field"><label>Deadline từ ngày</label><input type="date" id="fDeadlineFrom" value="${state.taskFilters.deadlineFrom}"></div>

        <tbody>
          ${shownList.length ? shownList.map(t=>{
            const a = byId(t.assignee), b = byId(t.assignedBy);
            const overdue = isOverdue(t.deadline, t.status);
            return `<tr class="clickable-row ${overdue?'row-overdue':''}" data-opentask="${t.id}">

  `;
}

  // người làm vừa là người duyệt task đó, nên cộng dồn action của cả 2 vai.
  if(mine){
    if(t.status==='assigned') actions += `<button class="btn btn-primary" data-taskaction="start">Bắt đầu làm</button>`;
    if(t.status==='in_progress') actions += `<button class="btn btn-primary" data-taskaction="submit">Nộp bài — chuyển Đợi duyệt</button>`;

                 <button class="btn btn-primary" data-taskaction="approve">Duyệt đạt</button>`;

    actions += `<button class="btn btn-ghost btn-sm" data-action="openEditTask" data-taskid="${t.id}">Sửa task</button>`;
    actions += `<button class="btn btn-ghost btn-sm" data-action="askDeleteTask" data-taskid="${t.id}" style="color:var(--danger);margin-left:auto;">Xoá task</button>`;
  }
  const comments = t.comments||[];
  return `
  <div class="modal-bg" data-close="modal">
    <div class="modal" data-stop="1">
      <div class="modal-head">
        <h2>${taskLabel(t)} · ${STATUS_META[t.status]?.label||t.status}</h2>

        <div class="detail-row"><div class="k">Từ khoá</div><div class="v"><b>${escapeHtml(t.keyword)}</b></div></div>
        <div class="detail-row"><div class="k">Phân loại</div><div class="v"><span class="tag ${TYPE_META[t.type]?.cls||''}">${TYPE_META[t.type]?.label||t.type}</span></div></div>
        <div class="detail-row"><div class="k">Nhân sự</div><div class="v">${escapeHtml(a.name)}</div></div>
        <div class="detail-row"><div class="k">Người giao</div><div class="v">${escapeHtml(b.name)}</div></div>
        <div class="detail-row"><div class="k">Deadline</div><div class="v">${t.deadline}${isOverdue(t.deadline,t.status)?' <span style="color:var(--danger);font-weight:700;">— đã trễ</span>':''}</div></div>
        <div class="detail-row"><div class="k">Mô tả</div><div class="v">${escapeHtml(t.desc)}</div></div>
        <div class="detail-row"><div class="k">File</div><div class="v">${t.fileLink?`<a href="${escapeHtml(t.fileLink)}" target="_blank" rel="noopener">${escapeHtml(t.fileLink)}</a>`:'<span style="color:var(--ink-faint)">Chưa có</span>'}</div></div>
        ${t.note?`<div class="detail-row"><div class="k">Ghi chú sửa</div><div class="v" style="color:var(--st-fix)">${escapeHtml(t.note)}</div></div>`:''}
        <div class="detail-row"><div class="k">Lịch sử</div><div class="v history">${(t.history||[]).map(h=>`<div class="history-item"><span class="t">${h.t}</span>${escapeHtml(h.text)}</div>`).join('')}</div></div>
        <div class="detail-row"><div class="k">Bình luận</div><div class="v">

/* ============================= CALENDAR PAGE ============================= */
function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
function dowMonFirst(y,m,d){ const j = new Date(y,m,d).getDay(); return j===0?6:j-1; }
function isoOf(y,m,d){ return `${y}-${pad2(m+1)}-${pad2(d)}`; }

// Accepts both the OLD shape ('work' | {leave:true,reason}) — kept from before
// shift-level tracking existed — and the NEW shape ({morning,afternoon,
// reason,status,submittedAt}), so nothing already saved breaks.
function normalizeDayEntry(raw){
  if(!raw) return null;
  if(raw==='work') return { morning:'work', afternoon:'work', reason:'', status:'approved', submittedAt:null };
  if(raw.leave) return { morning:'leave', afternoon:'leave', reason:raw.reason||'', status:raw.status||'pending', submittedAt:raw.submittedAt||null };
  return { morning:raw.morning||null, afternoon:raw.afternoon||null, reason:raw.reason||'', status:raw.status||'pending', submittedAt:raw.submittedAt||null };
}
function shiftBadgesHtml(entry){
  const seg=(label,v)=>{
    if(!v) return `<span class="shift-badge" style="opacity:.35;">${label}: –</span>`;
    const cls = v==='leave' ? 'leave' : 'work';
    const pend = entry.status==='pending' ? ' pending' : '';
    return `<span class="shift-badge ${cls}${pend}">${label}: ${v==='leave'?'Nghỉ':'Làm'}</span>`;
  };
  return `<div class="shift-badges">${seg('S',entry.morning)}${seg('C',entry.afternoon)}</div>`;
}
function statusPillHtml(status){
  const label = status==='approved'?'Đã duyệt':status==='rejected'?'Từ chối':'Chờ duyệt';
  return `<span class="status-pill ${status}">${label}</span>`;
}

function renderCalendarPage(u){
  const y = state.calYear, m = state.calMonth;
  const total = daysInMonth(y,m);
  const firstDow = dowMonFirst(y,m,1);
  const interns = USERS.filter(x=>x.role==='intern');
  const isIntern = u.role==='intern';

  const nextWeekDates = getNextWeekDates();
  const registeredNextWeek = isIntern && nextWeekDates.some(d => SCHEDULE[u.id] && SCHEDULE[u.id][d]);
  const banner = (isIntern && !registeredNextWeek && !state.bannerDismissed) ? `
    <div class="banner">
      <div>🔔 <strong>Nhắc đăng ký lịch làm việc:</strong> Bạn chưa đăng ký lịch cho tuần ${fmtDate(nextWeekDates[0])}–${fmtDate(nextWeekDates[6])}. Vào các ô ngày bên dưới để đánh dấu ca Sáng / Chiều: Làm việc hoặc Nghỉ phép.
        <div style="font-size:11.5px;color:var(--ink-faint);margin-top:4px;">Hệ thống cũng tự nhắc lại vào 8h sáng Chủ nhật hàng tuần (xem chuông thông báo) cho đến khi bạn đăng ký.</div>
      </div>
      <button class="x" data-action="dismissBanner">✕</button>
    </div>` : '';

  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-cell out"></div>`;
  for(let d=1; d<=total; d++){
    const iso = isoOf(y,m,d);
    let marks = '';
    let selfBlock = '';
    if(isIntern){
      const entry = normalizeDayEntry(SCHEDULE[u.id] && SCHEDULE[u.id][iso]);
      selfBlock = entry ? `${shiftBadgesHtml(entry)}${statusPillHtml(entry.status)}` : `<span class="cal-self-tag none">Chưa đăng ký</span>`;
    } else {
      interns.forEach(iu=>{
        const entry = normalizeDayEntry(SCHEDULE[iu.id] && SCHEDULE[iu.id][iso]);
        if(!entry) return;
        const hasLeave = entry.morning==='leave' || entry.afternoon==='leave';
        const cls = hasLeave ? 'leave' : 'work';
        const opacity = entry.status==='rejected' ? 'opacity:.35;text-decoration:line-through;' : entry.status==='pending' ? 'border:1.5px dashed currentColor;' : '';
        marks += `<span class="cal-mark ${cls}" style="${opacity}" title="${escapeHtml(iu.name)} — S:${entry.morning||'–'} C:${entry.afternoon||'–'} (${entry.status})${entry.reason?' — '+escapeHtml(entry.reason):''}">${initials(iu.name)}</span>`;
      });
    }
    cells += `<div class="cal-cell clickable" data-calday="${iso}">
      <div class="cal-daynum">${d}</div>
      ${isIntern? '' : `<div class="cal-marks">${marks}</div>`}
      ${isIntern? selfBlock : ''}
    </div>`;
  }

  // Unified "recent registrations" list — every shift registration across
  // the team (work AND leave), newest first, so the manager can duyệt/từ
  // chối straight from one place instead of hunting through the calendar.
  const registrations = [];
  if(!isIntern){
    interns.forEach(iu=>{
      const days = SCHEDULE[iu.id] || {};
      Object.keys(days).forEach(iso=>{
        const entry = normalizeDayEntry(days[iso]);
        if(entry && entry.submittedAt) registrations.push({ iu, date: iso, entry });
      });
    });
    registrations.sort((a,b)=>(b.entry.submittedAt||'').localeCompare(a.entry.submittedAt||''));
  }
  const pendingRegs = registrations.filter(r=>r.entry.status==='pending');
  const recentRegs = registrations.slice(0,15);

  return `
    ${banner}
    <div class="two-col">
      <div>
        <div class="cal-head">
          <div style="display:flex;align-items:center;gap:10px;">
            <button class="btn btn-ghost btn-sm" data-action="calPrev">◀</button>
            <h3>${MONTH_NAMES[m]} ${y}</h3>
            <button class="btn btn-ghost btn-sm" data-action="calNext">▶</button>
            <input type="date" id="calJump" title="Đi tới ngày bất kỳ" value="${isoOf(y,m,1)}" style="padding:6px 10px;border-radius:999px;border:1px solid var(--border);font-size:12px;background:var(--surface);color:var(--ink);">
          </div>
          <div class="cal-legend">
            <span><i style="background:var(--st-approved-soft);border:1px solid var(--st-approved)"></i>Làm việc</span>
            <span><i style="background:var(--st-fix-soft);border:1px solid var(--st-fix)"></i>Nghỉ phép</span>
            <span><i style="background:transparent;border:1.5px dashed var(--ink-faint)"></i>Chờ duyệt</span>
          </div>
        </div>
        <div class="cal-grid">
          ${['T2','T3','T4','T5','T6','T7','CN'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
          ${cells}
        </div>
        ${isIntern? `<div style="margin-top:12px;font-size:12px;color:var(--ink-faint)">Bấm vào 1 ngày để đăng ký ca Sáng / Chiều — mỗi lần đăng ký hoặc sửa đều cần Quản lý duyệt lại.</div>` : `<div style="margin-top:12px;font-size:12px;color:var(--ink-faint)">Bấm vào 1 ngày để xem ai làm việc / nghỉ phép hôm đó.</div>`}
      </div>
      <div class="panel">
        <h3>${isIntern? 'Trạng thái đăng ký của bạn' : `Đăng ký gần đây${pendingRegs.length?` · ${pendingRegs.length} chờ duyệt`:''}`}</h3>
        ${isIntern ? `
          <div style="font-size:12.5px;color:var(--ink-muted);line-height:1.7;">
            Bạn chỉ xem và chỉnh sửa được lịch của chính mình. Mỗi ca Sáng/Chiều đăng ký xong sẽ ở trạng thái "Chờ duyệt" cho đến khi Quản lý duyệt.
          </div>` : (recentRegs.length? `
          <div class="leave-req">
            ${recentRegs.map(r=>`
              <div class="reg-item">
                <div class="top"><b>${escapeHtml(r.iu.name)}</b>${statusPillHtml(r.entry.status)}</div>
                <div class="meta">${fmtDateFull(r.date)} · nộp lúc ${fmtDateTime(r.entry.submittedAt)}</div>
                ${shiftBadgesHtml(r.entry)}
                ${r.entry.reason?`<div class="reason">Lý do: ${escapeHtml(r.entry.reason)}</div>`:''}
                <div class="leave-req-actions">
                  ${r.entry.status==='pending' ? `
                  <button class="btn btn-sm btn-primary" data-regaction="approve" data-reguser="${r.iu.id}" data-regdate="${r.date}">Duyệt</button>
                  <button class="btn btn-sm btn-ghost" style="color:var(--danger)" data-regaction="reject" data-reguser="${r.iu.id}" data-regdate="${r.date}">Từ chối</button>` : ''}
                  <button class="btn btn-sm btn-ghost" data-action="openCalDayEditFor" data-edituser="${r.iu.id}" data-editdate="${r.date}">Sửa</button>
                  <button class="btn btn-sm btn-ghost" style="color:var(--danger)" data-action="askDeleteRegistration" data-eduser="${r.iu.id}" data-eddate="${r.date}">Xoá</button>
                </div>
              </div>`).join('')}
          </div>` : `<div style="font-size:12.5px;color:var(--ink-faint)">Chưa có đăng ký nào.</div>`)}
      </div>
    </div>
  `;
}

/* ============================= REPORTS PAGE ============================= */
const REPORT_RANGES = {
  this_week:  {label:'Tuần này'},
  last_week:  {label:'Tuần trước'},
  this_month: {label:'Tháng này'},
  last_month: {label:'Tháng trước'},
  custom:     {label:'Tuỳ chỉnh (chọn ngày)'},
};
function reportRangeDates(range){
  const today = new Date(todayISO()+'T00:00:00');
  let start, end;
  if(range==='custom'){
    const from = state.reportsCustomFrom || todayISO();
    const to = state.reportsCustomTo || todayISO();
    start = new Date((from<=to?from:to)+'T00:00:00');
    end = new Date((from<=to?to:from)+'T00:00:00');
  } else if(range==='this_week'||range==='last_week'){
    start = new Date(mondayOf(today)+'T00:00:00');
    if(range==='last_week') start.setDate(start.getDate()-7);
    end = new Date(start); end.setDate(start.getDate()+6);
  } else {
    start = new Date(today.getFullYear(), today.getMonth() + (range==='last_month'?-1:0), 1);
    end = new Date(start.getFullYear(), start.getMonth()+1, 0);
  }
  const spanDays = Math.round((end-start)/86400000)+1;
  const prevEnd = new Date(start); prevEnd.setDate(prevEnd.getDate()-1);
  const prevStart = new Date(prevEnd); prevStart.setDate(prevEnd.getDate()-spanDays+1);
  const toIso = d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  return { start:toIso(start), end:toIso(end), prevStart:toIso(prevStart), prevEnd:toIso(prevEnd) };
}
function deltaHtml(cur, prev, unit){
  if(prev===0 && cur===0) return `<div class="delta">Không đổi so với kỳ trước</div>`;
  if(prev===0) return `<div class="delta up">▲ mới so với kỳ trước</div>`;
  const pct = Math.round(((cur-prev)/prev)*100);
  const cls = pct>0?'up':pct<0?'down':'';
  const arrow = pct>0?'▲':pct<0?'▼':'—';
  return `<div class="delta ${cls}">${arrow} ${Math.abs(pct)}% so với kỳ trước${unit?` (${prev}${unit})`:` (${prev})`}</div>`;
}
function firstPassRateOf(list){
  const submitted = list.filter(t=>(t.history||[]).some(h=>h.text.includes('Đợi duyệt')));
  if(!submitted.length) return 0;
  const clean = submitted.filter(t=>t.status==='approved' && !(t.history||[]).some(h=>h.text.includes('yêu cầu sửa')));
  return Math.round((clean.length/submitted.length)*100);
}
function renderReportsPage(u){
  // Ai cũng có thể tự tạo task giao cho chính mình (kể cả Admin/Manager), nên
  // bảng "Hiệu suất theo nhân sự" phải tính TOÀN BỘ nhân sự, không chỉ thực
  // tập sinh — nếu không, task tự giao của Admin/Manager sẽ không xuất hiện.
  const allStaffFull = USERS.slice().sort((a,b)=>a.name.localeCompare(b.name));
  // Lọc theo 1 nhân sự cụ thể (bao gồm cả Admin/Manager tự giao task cho
  // chính mình) — '' nghĩa là xem toàn đội, chọn 1 người thì toàn bộ số liệu
  // trên trang này (thống kê, biểu đồ, bảng chi tiết) chỉ tính riêng người đó.
  const scopedTasks = state.reportsPerson ? TASKS.filter(t=>t.assignee===state.reportsPerson) : TASKS;
  const allStaff = state.reportsPerson ? allStaffFull.filter(p=>p.id===state.reportsPerson) : allStaffFull;
  const {start, end, prevStart, prevEnd} = reportRangeDates(state.reportsRange);
  const inRange = scopedTasks.filter(t=>t.createdAt>=start && t.createdAt<=end);
  const inPrevRange = scopedTasks.filter(t=>t.createdAt>=prevStart && t.createdAt<=prevEnd);

  const totalTasks = inRange.length, prevTotal = inPrevRange.length;
  const approved = inRange.filter(t=>t.status==='approved').length;
  const prevApproved = inPrevRange.filter(t=>t.status==='approved').length;
  const overdueAll = scopedTasks.filter(t=>isOverdue(t.deadline,t.status));
  const overdueInRange = inRange.filter(t=>isOverdue(t.deadline,t.status)).length;
  const prevOverdue = inPrevRange.filter(t=>isOverdue(t.deadline,t.status)).length;
  const overdueRate = totalTasks ? Math.round((overdueInRange/totalTasks)*100) : 0;
  const prevOverdueRate = prevTotal ? Math.round((prevOverdue/prevTotal)*100) : 0;
  const firstPassRate = firstPassRateOf(inRange), prevFirstPassRate = firstPassRateOf(inPrevRange);

  const perIntern = allStaff.map(iu=>{
    const own = inRange.filter(t=>t.assignee===iu.id);
    const done = own.filter(t=>t.status==='approved').length;
    const late = own.filter(t=>isOverdue(t.deadline,t.status)).length;
    const doing = own.filter(t=>['in_progress','review'].includes(t.status)).length;
    const lateRate = own.length ? Math.round((late/own.length)*100) : 0;
    return {iu, total:own.length, done, late, doing, rate:firstPassRateOf(own), lateRate};
  });
  const maxDone = Math.max(1, ...perIntern.map(p=>p.done));

  // Phân loại breakdown (cohort của kỳ đang chọn).
  const byType = TYPE_ORDER.map(ty=>({ty, count: inRange.filter(t=>t.type===ty).length}));
  const maxType = Math.max(1, ...byType.map(x=>x.count));

  // Phân bố trạng thái (donut) — cohort của kỳ đang chọn.
  const byStatus = STATUS_ORDER.map(s=>({s, count: inRange.filter(t=>t.status===s).length}));
  const totalForDonut = Math.max(1, byStatus.reduce((a,b)=>a+b.count,0));
  let acc = 0;
  const conicStops = byStatus.filter(x=>x.count>0).map(x=>{
    const from = acc/totalForDonut*100; acc += x.count; const to = acc/totalForDonut*100;
    return `var(--st-${x.s}) ${from}% ${to}%`;
  }).join(', ') || 'var(--border) 0% 100%';

  // 8 tuần gần nhất — biểu đồ cột chồng theo trạng thái.
  const weeks = []; let wm = currentWeekMonday();
  for(let i=0;i<8;i++){ weeks.unshift({monday:wm, weekId:isoWeekId(wm)}); wm = addDaysISO(wm,-7); }
  const maxWeekCount = Math.max(1, ...weeks.map(w=>scopedTasks.filter(t=>t.weekId===w.weekId).length));

  // Task đang trễ deadline ngay lúc này (không phụ thuộc kỳ đang chọn).
  const overdueRows = overdueAll.slice().sort((a,b)=>overdueDays(b.deadline)-overdueDays(a.deadline));

  const watchItems = [];
  if(overdueAll.length>0) watchItems.push(`${overdueAll.length} task đang trễ deadline tính đến hôm nay, ưu tiên nhắc nhân sự phụ trách.`);
  const pendingReviewCount = scopedTasks.filter(t=>t.status==='review').length;
  if(pendingReviewCount>0) watchItems.push(`${pendingReviewCount} task đang ở trạng thái "Đợi duyệt", ưu tiên duyệt hoặc yêu cầu sửa sớm.`);
  watchItems.push(`Tỷ lệ đạt duyệt lần đầu kỳ này ${firstPassRate}% — ${firstPassRate>=80?'đang tốt, duy trì brief rõ ràng.':'thấp hơn mục tiêu 80%, nên rà lại brief giao việc.'}`);

  return `
    <div class="section-title">
      <div class="range-picker">
        ${Object.keys(REPORT_RANGES).map(r=>`<button class="range-btn ${state.reportsRange===r?'active':''}" data-reportrange="${r}">${REPORT_RANGES[r].label}</button>`).join('')}
        ${state.reportsRange==='custom' ? `
          <input type="date" id="reportCustomFrom" value="${state.reportsCustomFrom}" style="padding:6px 10px;border-radius:999px;border:1px solid var(--border);font-size:12px;">
          <span style="align-self:center;color:var(--ink-faint);font-size:12px;">đến</span>
          <input type="date" id="reportCustomTo" value="${state.reportsCustomTo}" style="padding:6px 10px;border-radius:999px;border:1px solid var(--border);font-size:12px;">
        ` : ''}
        <select id="reportPerson" style="padding:6px 10px;border-radius:999px;border:1px solid var(--border);font-size:12px;background:var(--surface);color:var(--ink);">
          <option value="">Toàn đội</option>
          ${allStaffFull.map(p=>`<option value="${p.id}" ${state.reportsPerson===p.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}
        </select>
      </div>
      <div style="font-size:11.5px;color:var(--ink-faint);">${fmtDateFull(start)} – ${fmtDateFull(end)} · so với ${fmtDateFull(prevStart)} – ${fmtDateFull(prevEnd)}</div>
    </div>

    <div class="stat-row">
      <div class="stat-card"><div class="label">Task giao trong kỳ</div><div class="value num">${totalTasks}</div>${deltaHtml(totalTasks,prevTotal)}</div>
      <div class="stat-card"><div class="label">Hoàn thành (đã duyệt)</div><div class="value success num">${approved}</div>${deltaHtml(approved,prevApproved)}</div>
      <div class="stat-card"><div class="label">Trễ deadline (trong kỳ)</div><div class="value ${overdueInRange>0?'danger':''} num">${overdueInRange}</div>${deltaHtml(overdueInRange,prevOverdue)}</div>
      <div class="stat-card"><div class="label">Tỷ lệ đạt duyệt lần đầu</div><div class="value accent num">${firstPassRate}%</div>${deltaHtml(firstPassRate,prevFirstPassRate,'%')}</div>
      <div class="stat-card"><div class="label">Tỷ lệ trễ deadline</div><div class="value ${overdueRate>0?'danger':''} num">${overdueRate}%</div>${deltaHtml(overdueRate,prevOverdueRate,'%')}</div>
    </div>

    <div class="two-col">
      <div class="panel">
        <h3>Task theo tuần (8 tuần gần nhất)</h3>
        <div class="stack-chart">
          ${weeks.map(w=>{
            const wtasks = scopedTasks.filter(t=>t.weekId===w.weekId);
            const h = Math.max(4,(wtasks.length/maxWeekCount)*100);
            const segs = STATUS_ORDER.map(s=>{
              const c = wtasks.filter(t=>t.status===s).length; if(!c) return '';
              const segH = (c/Math.max(1,wtasks.length))*100;
              return `<div class="stack-seg" style="height:${segH}%;background:var(--st-${s});" title="${STATUS_META[s].label}: ${c}"></div>`;
            }).join('');
            return `<div class="stack-col" style="height:${h}%;" title="Tuần ${w.weekId} — ${wtasks.length} task">${segs}</div>`;
          }).join('')}
        </div>
        <div class="stack-labels">${weeks.map(w=>`<span>${w.weekId.split('-W')[1]}</span>`).join('')}</div>
      </div>
      <div class="panel">
        <h3>Phân bố trạng thái (kỳ này)</h3>
        <div class="donut-row">
          <div class="donut" style="background:conic-gradient(${conicStops});"></div>
          <div class="donut-legend">
            ${byStatus.filter(x=>x.count>0).map(x=>`<div class="donut-legend-item"><i style="background:var(--st-${x.s})"></i>${STATUS_META[x.s].label}<b class="num">${x.count}</b></div>`).join('') || '<div style="font-size:12px;color:var(--ink-faint)">Chưa có task nào trong kỳ.</div>'}
          </div>
        </div>
      </div>
    </div>

    <div class="two-col" style="margin-top:20px;">
      <div class="panel">
        <h3>Theo phân loại (kỳ này)</h3>
        <div class="chart-wrap">
          ${byType.map(x=>`
            <div class="bar-row">
              <div class="bname">${TYPE_META[x.ty].label}</div>
              <div class="bar-track"><div class="bar-fill" style="width:${Math.max(6,(x.count/maxType)*100)}%"><span class="bar-val">${x.count}</span></div></div>
            </div>`).join('')}
        </div>
      </div>
      <div class="panel">
        <h3>Điểm cần theo dõi tiếp</h3>
        <div class="numbered-list">
          ${watchItems.map((w,i)=>`<div class="numbered-item"><div class="numbered-circle">${i+1}</div><div>${w}</div></div>`).join('')}
        </div>
      </div>
    </div>

    <div class="panel" style="margin-top:20px;">
      <h3>Chi tiết theo nhân sự (kỳ này)</h3>
      <div class="scrollx"><table class="data-table">
        <thead><tr><th>Nhân sự</th><th>Tổng giao</th><th>Hoàn thành</th><th>Đang xử lý</th><th>Trễ hạn</th><th>Tỷ lệ trễ deadline</th><th>Tỷ lệ đạt lần đầu</th></tr></thead>
        <tbody>
          ${perIntern.length? perIntern.map(p=>`<tr>
            <td>${escapeHtml(p.iu.name)}</td>
            <td class="num-cell">${p.total}</td>
            <td class="num-cell" style="color:var(--success);font-weight:700;">${p.done}</td>
            <td class="num-cell">${p.doing}</td>
            <td class="num-cell" style="color:${p.late>0?'var(--danger)':'inherit'};font-weight:${p.late>0?'700':'400'};">${p.late}</td>
            <td class="num-cell" style="color:${p.lateRate>0?'var(--danger)':'inherit'};font-weight:${p.lateRate>0?'700':'400'};">${p.lateRate}%</td>
            <td class="num-cell">${p.rate}%</td>
          </tr>`).join('') : `<tr><td colspan="7" style="color:var(--ink-faint);">Chưa có dữ liệu.</td></tr>`}
        </tbody>
      </table></div>
    </div>

    <div class="panel" style="margin-top:20px;">
      <h3>Task đang trễ deadline${overdueRows.length?` (${overdueRows.length})`:''}</h3>
      <div class="scrollx"><table class="data-table">
        <thead><tr><th>Task ID</th><th>Từ khoá</th><th>Nhân sự</th><th>Deadline</th><th>Số ngày trễ</th><th>Trạng thái</th></tr></thead>
        <tbody>
          ${overdueRows.length? overdueRows.map(t=>`<tr>
            <td class="num-cell">${taskLabel(t)}</td>
            <td>${escapeHtml(t.keyword)}</td>
            <td>${escapeHtml(byId(t.assignee).name)}</td>
            <td class="num-cell">${fmtDate(t.deadline)}</td>
            <td class="num-cell" style="color:var(--danger);font-weight:700;">${overdueDays(t.deadline)}</td>
            <td><span class="pill pill-${t.status}">${STATUS_META[t.status]?.label||t.status}</span></td>
          </tr>`).join('') : `<tr><td colspan="6" style="color:var(--ink-faint);">Không có task nào trễ deadline 🎉</td></tr>`}
        </tbody>
      </table></div>
    </div>
  `;
}
