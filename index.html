            <div style="font-size:11px;color:var(--ink-faint);margin-top:4px;">Email THẬT để nhận thông báo (khác với tài khoản đăng nhập ở trên). Có thể để trống rồi bổ sung sau ở nút "Sửa".</div>
          </div>
        </div>
        <div class="modal-foot">
          <button type="button" class="btn btn-ghost" data-action="closePersonModal">Huỷ</button>
          <button type="submit" class="btn btn-primary">Thêm nhân sự</button>
        </div>
      </form>
    </div>
  </div>`;
}

/* ============================= EVENT HANDLERS ============================= */
function attachHandlers(){
  const app = document.getElementById('app');

  const loginForm = document.getElementById('loginForm');
  if(loginForm){
    loginForm.addEventListener('submit', async e=>{
      e.preventDefault();
      const uname = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value;
      const btn = loginForm.querySelector('button[type="submit"]');
      state.loginError=''; if(btn) btn.disabled = true;
      const { error } = await sb.auth.signInWithPassword({ email: usernameToEmail(uname), password: pass });
      if(error){
        const msg = String(error.message||'');
        state.loginError = msg.toLowerCase().includes('invalid login credentials') ? 'Sai tài khoản hoặc mật khẩu.' : ('Lỗi đăng nhập: ' + msg);
        render();
      }
      if(btn) btn.disabled = false;
    });
    initLoginScene();
  }

  app.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click', ()=>{ state.page=b.dataset.nav; state.openTaskId=null; render(); }));
  const logoutBtn = app.querySelector('[data-action="logout"]');
  if(logoutBtn) logoutBtn.addEventListener('click', ()=>{ sb.auth.signOut(); });

  app.querySelectorAll('[data-opentask]').forEach(c=>c.addEventListener('click', ()=>{ state.openTaskId=c.dataset.opentask; render(); }));
  const closeModalBtn = app.querySelector('[data-action="closeModal"]');
  if(closeModalBtn) closeModalBtn.addEventListener('click', ()=>{ state.openTaskId=null; render(); });
  app.querySelectorAll('[data-close="modal"]').forEach(bg=>bg.addEventListener('click', (e)=>{ if(e.target===bg){ state.openTaskId=null; render(); } }));

  const openTaskFormBtn = app.querySelector('[data-action="openTaskForm"]');
  if(openTaskFormBtn) openTaskFormBtn.addEventListener('click', ()=>{ state.showTaskForm=true; render(); });
  app.querySelectorAll('[data-action="closeTaskForm"]').forEach(b=>b.addEventListener('click', ()=>{ state.showTaskForm=false; render(); }));
  app.querySelectorAll('[data-close="taskform"]').forEach(bg=>bg.addEventListener('click', (e)=>{ if(e.target===bg){ state.showTaskForm=false; render(); } }));

  const newTaskForm = document.getElementById('newTaskForm');
  if(newTaskForm) newTaskForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const assignee = document.getElementById('ntAssignee').value;
    if(!assignee) return;
    await dbApi.collection('tasks').add({
      keyword: document.getElementById('ntKeyword').value,
      type: document.getElementById('ntType').value,
      assignee, assignedBy: state.authedUser.id,
      deadline: document.getElementById('ntDeadline').value,
      createdAt: todayISO(), status:'assigned', fileLink:'',
      desc: document.getElementById('ntDesc').value || '(không có mô tả thêm)',
      history:[{t:todayDMY(), text: assignee===state.authedUser.id ? 'Tự tạo task cho bản thân' : `Giao việc cho ${byId(assignee).name}`}],
      comments:[],
    });
    state.showTaskForm=false; render();
  });

  app.querySelectorAll('[data-action="openEditTask"]').forEach(b=>b.addEventListener('click', ()=>{ state.editTaskModal=b.dataset.taskid; render(); }));
  app.querySelectorAll('[data-action="closeEditTask"]').forEach(b=>b.addEventListener('click', ()=>{ state.editTaskModal=null; render(); }));
  app.querySelectorAll('[data-close="edittaskmodal"]').forEach(bg=>bg.addEventListener('click', (e)=>{ if(e.target===bg){ state.editTaskModal=null; render(); } }));

  const editTaskForm = document.getElementById('editTaskForm');
  if(editTaskForm) editTaskForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const t = getTaskById(state.editTaskModal); if(!t) return;
    const newAssignee = document.getElementById('etAssignee').value || t.assignee;
    const patch = {
      keyword: document.getElementById('etKeyword').value.trim(),
      type: document.getElementById('etType').value,
      assignee: newAssignee,
      deadline: document.getElementById('etDeadline').value,
      desc: document.getElementById('etDesc').value,
    };
    const changed = [];
    if(patch.keyword !== t.keyword) changed.push('từ khoá');
    if(patch.type !== t.type) changed.push('phân loại');
    if(patch.assignee !== t.assignee) changed.push(`nhân sự (→ ${byId(newAssignee).name})`);
    if(patch.deadline !== t.deadline) changed.push('deadline');
    if(patch.desc !== (t.desc||'')) changed.push('mô tả');
    const newHistory = [...(t.history||[]), {t:todayDMY(), text: changed.length ? `Quản lý sửa task: ${changed.join(', ')}` : 'Quản lý cập nhật task (không đổi nội dung)'}];
    await dbApi.collection('tasks').doc(t.id).update({...patch, history:newHistory});
    state.editTaskModal=null; render();
  });

  app.querySelectorAll('[data-taskaction]').forEach(b=>b.addEventListener('click', async ()=>{
    const t = getTaskById(state.openTaskId); if(!t) return;
    const act = b.dataset.taskaction;
    if(act==='start'){
      const newHistory=[...(t.history||[]), {t:todayDMY(), text:'Chuyển "Đang thực hiện"'}];
      await dbApi.collection('tasks').doc(t.id).update({status:'in_progress', history:newHistory});
    }
    if(act==='submit'){ state.submitModal={taskId:t.id, mode:'submit'}; render(); return; }
    if(act==='resubmit'){ state.submitModal={taskId:t.id, mode:'resubmit'}; render(); return; }
    if(act==='requestfix'){ state.fixModal={taskId:t.id}; render(); return; }
    if(act==='approve'){
      const newHistory=[...(t.history||[]), {t:todayDMY(), text:'Quản lý duyệt đạt'}];
      await dbApi.collection('tasks').doc(t.id).update({status:'approved', history:newHistory});
      // Cập nhật lại đúng dòng đã có trên Google Sheet (trạng thái -> Đã
      // duyệt) — không tạo dòng mới, xem enqueueSheetSync().
      await enqueueSheetSync({...t, status:'approved'}, STATUS_META.approved.label);
    }
  }));

  app.querySelectorAll('[data-action="addComment"]').forEach(b=>b.addEventListener('click', async ()=>{
    const ta = document.getElementById('newCommentText'); const text=(ta.value||'').trim(); if(!text) return;
    const t = getTaskById(b.dataset.taskid); if(!t) return;
    const comment = {id:'c'+Date.now(), authorId:state.authedUser.id, authorName:state.authedUser.name, text, createdAt:nowISOTime()};
    const newComments = [...(t.comments||[]), comment];
    await dbApi.collection('tasks').doc(t.id).update({comments:newComments});
  }));

  const submitLinkForm = document.getElementById('submitLinkForm');
  if(submitLinkForm) submitLinkForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const sm = state.submitModal; const t = getTaskById(sm.taskId); if(!t) return;
    const link = document.getElementById('submitLink').value.trim();
    const note = document.getElementById('submitNote').value.trim();
    const finalLink = link || t.fileLink || ''; // giữ link cũ nếu nộp lại mà bỏ trống ô link
    const isResubmit = sm.mode==='resubmit';
    // Không còn trạng thái "Đã sửa" riêng — nộp lần đầu hay nộp lại sau khi
    // bị yêu cầu sửa đều chuyển thẳng về "Đợi duyệt" (in_progress -> review).
    const newStatus = 'review';
    const histText = isResubmit ? 'Đã sửa và nộp lại, chuyển "Đợi duyệt"' : 'Nộp bài, chuyển "Đợi duyệt"';
    const newHistory = [...(t.history||[]), {t:todayDMY(), text:histText}];
    const commentText = [note, finalLink ? `Link: ${finalLink}` : ''].filter(Boolean).join('\n') || 'Đã nộp bài (không kèm link/ghi chú).';
    const newComments = [...(t.comments||[]), {id:'c'+Date.now(), authorId:state.authedUser.id, authorName:state.authedUser.name, text:commentText, createdAt:nowISOTime()}];
    await dbApi.collection('tasks').doc(t.id).update({ status:newStatus, fileLink:finalLink, history:newHistory, comments:newComments });
    // Đồng bộ TOÀN BỘ thông tin task sang Google Sheet MỖI LẦN nộp để chờ
    // duyệt — dù nộp lần đầu hay nộp lại sau khi bị yêu cầu sửa — không bao
    // giờ được bỏ bước này (ghi vào đúng 1 dòng của task, xem enqueueSheetSync()).
    await enqueueSheetSync({...t, status:newStatus, fileLink:finalLink}, STATUS_META[newStatus].label, note);
    state.submitModal = null;
    render();
  });

  const fixForm = document.getElementById('fixForm');
  if(fixForm) fixForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const fm = state.fixModal; const t = getTaskById(fm.taskId); if(!t) return;
    const note = document.getElementById('fixNote').value.trim();
    // Không còn trạng thái "Cần sửa" riêng — quản lý yêu cầu sửa sẽ đưa task
    // quay lại "Đang thực hiện" để nhân sự sửa rồi nộp lại (in_progress ->
    // review), giữ nguyên cụm "yêu cầu sửa" trong lịch sử vì báo cáo
    // (firstPassRateOf) đang dò chuỗi này để tính tỷ lệ đạt duyệt lần đầu.
    const newHistory = [...(t.history||[]), {t:todayDMY(), text:'Quản lý yêu cầu sửa, chuyển về "Đang thực hiện"'}];
    await dbApi.collection('tasks').doc(t.id).update({status:'in_progress', note, history:newHistory});
    state.fixModal = null;
    render();
  });

  app.querySelectorAll('[data-action="askDeleteTask"]').forEach(b=>b.addEventListener('click', ()=>{
    state.confirmModal = {title:'Xoá task', message:'Xoá task này? Hành động không thể hoàn tác.', confirmLabel:'Xoá task', onConfirm:'deleteTask', payload:b.dataset.taskid};
    render();
  }));
  app.querySelectorAll('[data-action="confirmYes"]').forEach(b=>b.addEventListener('click', async ()=>{
    const cm = state.confirmModal; if(!cm) return;
    if(cm.onConfirm==='removeUser'){
      try{ await callFn('delete-team-member', {uid: cm.payload}); }
      catch(err){ alert('Không xoá được: ' + (err.message||err)); }
    }
    if(cm.onConfirm==='deleteTask'){ await dbApi.collection('tasks').doc(cm.payload).delete(); state.openTaskId=null; }
    if(cm.onConfirm==='deleteRegistration'){
      const {uid, date} = cm.payload;
      const daysObj = {...(SCHEDULE[uid]||{})};
      delete daysObj[date];
      await dbApi.collection('schedule').doc(uid).set({days:daysObj});
    }
    state.confirmModal=null; render();
  }));

  ['fQ','fStatus','fType','fAssignedBy','fAssignee','fDeadlineFrom','fDeadlineTo'].forEach(id=>{
    const el = document.getElementById(id); if(!el) return;
    const key = id.slice(1,2).toLowerCase()+id.slice(2);
    el.addEventListener('input', ()=>{ state.taskFilters[key]=el.value; render(); restoreFocus(id); });
    el.addEventListener('change', ()=>{ state.taskFilters[key]=el.value; render(); });
  });
  const clearBtn = app.querySelector('[data-action="clearFilters"]');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{ state.taskFilters={q:'',status:'',type:'',assignedBy:'',assignee:'',deadlineFrom:'',deadlineTo:''}; render(); });
  const weekJump = document.getElementById('weekJump');
  if(weekJump) weekJump.addEventListener('change', ()=>{ if(weekJump.value){ state.taskWeekMonday = mondayOf(weekJump.value); render(); } });

  app.querySelectorAll('[data-tasktab]').forEach(b=>b.addEventListener('click', ()=>{ state.taskTab=b.dataset.tasktab; render(); }));
  app.querySelectorAll('[data-reportrange]').forEach(b=>b.addEventListener('click', ()=>{ state.reportsRange=b.dataset.reportrange; render(); }));
  const rcFrom = document.getElementById('reportCustomFrom');
  if(rcFrom) rcFrom.addEventListener('change', ()=>{ state.reportsCustomFrom = rcFrom.value; render(); });
  const rcTo = document.getElementById('reportCustomTo');
  if(rcTo) rcTo.addEventListener('change', ()=>{ state.reportsCustomTo = rcTo.value; render(); });
  const reportPerson = document.getElementById('reportPerson');
  if(reportPerson) reportPerson.addEventListener('change', ()=>{ state.reportsPerson = reportPerson.value; render(); });
  const weekPrev = app.querySelector('[data-action="weekPrev"]');
  if(weekPrev) weekPrev.addEventListener('click', ()=>{ state.taskWeekMonday = addDaysISO(state.taskWeekMonday, -7); render(); });
  const weekNext = app.querySelector('[data-action="weekNext"]');
  if(weekNext) weekNext.addEventListener('click', ()=>{ state.taskWeekMonday = addDaysISO(state.taskWeekMonday, 7); render(); });
  const weekToday = app.querySelector('[data-action="weekToday"]');
  if(weekToday) weekToday.addEventListener('click', ()=>{ state.taskWeekMonday = currentWeekMonday(); render(); });
  const backlogPrev = app.querySelector('[data-action="backlogPrev"]');
  if(backlogPrev) backlogPrev.addEventListener('click', ()=>{ state.backlogPage = Math.max(1, state.backlogPage-1); render(); });
  const backlogNext = app.querySelector('[data-action="backlogNext"]');
  if(backlogNext) backlogNext.addEventListener('click', ()=>{ state.backlogPage = state.backlogPage+1; render(); });

  const bellBtn = app.querySelector('[data-action="toggleBell"]');
  if(bellBtn) bellBtn.addEventListener('click', (e)=>{ e.stopPropagation(); state.notifOpen = !state.notifOpen; render(); });
  const bellPanel = app.querySelector('.bell-panel');
  if(bellPanel) bellPanel.addEventListener('click', e=>e.stopPropagation());
  const markAllBtn = app.querySelector('[data-action="markAllRead"]');
  if(markAllBtn) markAllBtn.addEventListener('click', async (e)=>{
    e.stopPropagation();
    const unread = NOTIFICATIONS.filter(n=>!n.readAt);
    for(const n of unread){ try{ await dbApi.collection('notifications').doc(n.id).update({readAt: nowISOTime()}); }catch(err){} }
  });
  app.querySelectorAll('[data-notifid]').forEach(el=>el.addEventListener('click', async (e)=>{
    e.stopPropagation();
    const n = NOTIFICATIONS.find(x=>x.id===el.dataset.notifid);
    if(n && !n.readAt){ try{ await dbApi.collection('notifications').doc(n.id).update({readAt: nowISOTime()}); }catch(err){} }
  }));

  const dismissBtn = app.querySelector('[data-action="dismissBanner"]');
  if(dismissBtn) dismissBtn.addEventListener('click', ()=>{ state.bannerDismissed=true; render(); });

  const calPrev = app.querySelector('[data-action="calPrev"]');
  if(calPrev) calPrev.addEventListener('click', ()=>{ state.calMonth--; if(state.calMonth<0){state.calMonth=11; state.calYear--;} render(); });
  const calNext = app.querySelector('[data-action="calNext"]');
  if(calNext) calNext.addEventListener('click', ()=>{ state.calMonth++; if(state.calMonth>11){state.calMonth=0; state.calYear++;} render(); });
  const calJump = document.getElementById('calJump');
  if(calJump) calJump.addEventListener('change', ()=>{
    if(!calJump.value) return;
    const [jy,jm] = calJump.value.split('-').map(Number);
    state.calYear = jy; state.calMonth = jm-1; render();
  });

  app.querySelectorAll('[data-calday]').forEach(cell=>cell.addEventListener('click', ()=>{
    const iso = cell.dataset.calday;
    if(state.authedUser.role==='intern'){ state.calDayModal = {date: iso}; }
    else { state.calDayViewModal = {date: iso}; }
    render();
  }));
  app.querySelectorAll('[data-action="openCalDayEditFor"]').forEach(b=>b.addEventListener('click', ()=>{
    state.calDayModal = {date: b.dataset.editdate, userId: b.dataset.edituser, fromView:true};
    state.calDayViewModal = null;
    render();
  }));
  app.querySelectorAll('[data-action="askDeleteRegistration"]').forEach(b=>b.addEventListener('click', ()=>{
    const uid = b.dataset.eduser, date = b.dataset.eddate;
    const person = byId(uid);
    state.confirmModal = {title:'Xoá đăng ký lịch', message:`Xoá đăng ký ngày ${fmtDateFull(date)} của "${person.name}"? Thao tác này không thể hoàn tác.`, confirmLabel:'Xoá', onConfirm:'deleteRegistration', payload:{uid,date}};
    render();
  }));
  app.querySelectorAll('[data-shiftpick]').forEach(b=>b.addEventListener('click', ()=>{
    const key = b.dataset.shiftpick; // 'morning' | 'afternoon'
    const hidden = document.getElementById(key==='morning'?'shiftMorning':'shiftAfternoon'); if(!hidden) return;
    hidden.value = b.dataset.shiftval;
    app.querySelectorAll(`[data-shiftpick="${key}"]`).forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  }));
  const calDayForm = document.getElementById('calDayForm');
  if(calDayForm) calDayForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const cd = state.calDayModal;
    const uid = cd.userId || state.authedUser.id;
    const isOnBehalf = !!cd.userId && cd.userId !== state.authedUser.id;
    const morning = document.getElementById('shiftMorning').value || null;
    const afternoon = document.getElementById('shiftAfternoon').value || null;
    const reason = document.getElementById('leaveReason').value.trim();
    const daysObj = {...(SCHEDULE[uid]||{})};
    if(!morning && !afternoon){
      delete daysObj[cd.date];
    } else {
      daysObj[cd.date] = { morning, afternoon, reason, status: isOnBehalf ? 'approved' : 'pending', submittedAt: nowISOTime() };
    }
    await dbApi.collection('schedule').doc(uid).set({days:daysObj});
    state.calDayModal = null;
    if(cd.fromView) state.calDayViewModal = {date: cd.date};
    render();
  });

  app.querySelectorAll('[data-regaction]').forEach(b=>b.addEventListener('click', async ()=>{
    const uid = b.dataset.reguser, date = b.dataset.regdate;
    const daysObj = {...(SCHEDULE[uid]||{})};
    const entry = normalizeDayEntry(daysObj[date]); if(!entry) return;
    if(b.dataset.regaction==='approve'){
      daysObj[date] = {...entry, status:'approved'};
    } else {
      daysObj[date] = {...entry, status:'rejected'};
    }
    await dbApi.collection('schedule').doc(uid).set({days:daysObj});
  }));

  app.querySelectorAll('[data-rolechange]').forEach(sel=>sel.addEventListener('change', async ()=>{
    const uid = sel.dataset.rolechange, newRole = sel.value, prevRole = sel.dataset.prevrole;
    sel.disabled = true;
    try{ await callFn('update-team-member', {uid, role:newRole}); }
    catch(err){ alert('Không đổi được vai trò: ' + (err.message||err)); sel.value = prevRole; }
    sel.disabled = false;
  }));
  app.querySelectorAll('[data-removeuser]').forEach(b=>b.addEventListener('click', ()=>{
    const person = byId(b.dataset.removeuser);
    state.confirmModal = {title:'Xoá nhân sự', message:`Xoá "${person.name}" khỏi hệ thống? Các task đã giao trước đó vẫn còn nhưng sẽ hiện "(đã xoá)".`, confirmLabel:'Xoá', onConfirm:'removeUser', payload:person.id};
    render();
  }));

  const openPersonBtn = app.querySelector('[data-action="openPersonModal"]');
  if(openPersonBtn) openPersonBtn.addEventListener('click', ()=>{ state.personModal=true; render(); });
  const personForm = document.getElementById('personForm');
  if(personForm) personForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const btn = personForm.querySelector('button[type="submit"]');
    if(btn) btn.disabled = true;
    try{
      await callFn('create-team-member', {
        name: document.getElementById('pName').value.trim(),
        role: document.getElementById('pRole').value,
        title: document.getElementById('pTitle').value.trim(),
        username: document.getElementById('pUsername').value.trim(),
        password: document.getElementById('pPassword').value,
        email: document.getElementById('pEmail').value.trim(),
      });
      state.personModal = false;
    }catch(err){
      alert('Không thêm được nhân sự: ' + (err.message||err));
    }
    if(btn) btn.disabled = false;
    render();
  });

  app.querySelectorAll('[data-editperson]').forEach(b=>b.addEventListener('click', ()=>{
    const person = byId(b.dataset.editperson); if(!person) return;
    state.editPersonModal = {uid: person.id, name: person.name, title: person.title||'', email: person.email||''};
    render();
  }));
  const editPersonForm = document.getElementById('editPersonForm');
  if(editPersonForm) editPersonForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const btn = editPersonForm.querySelector('button[type="submit"]');
    if(btn) btn.disabled = true;
    try{
      await callFn('update-team-member', {
        uid: state.editPersonModal.uid,
        name: document.getElementById('epName').value.trim(),
        title: document.getElementById('epTitle').value.trim(),
        email: document.getElementById('epEmail').value.trim(),
      });
      state.editPersonModal = null;
    }catch(err){
      alert('Không lưu được thông tin: ' + (err.message||err));
    }
    if(btn) btn.disabled = false;
    render();
  });

  app.querySelectorAll('[data-resetpw]').forEach(b=>b.addEventListener('click', ()=>{
    state.resetPwModal = {uid: b.dataset.resetpw, name: b.dataset.personname};
    render();
  }));
  const resetPwForm = document.getElementById('resetPwForm');
  if(resetPwForm) resetPwForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const btn = resetPwForm.querySelector('button[type="submit"]');
    if(btn) btn.disabled = true;
    try{
      await callFn('reset-team-member-password', {uid: state.resetPwModal.uid, newPassword: document.getElementById('newPwInput').value});
      state.resetPwModal = null;
    }catch(err){
      alert('Không đặt lại được mật khẩu: ' + (err.message||err));
    }
    if(btn) btn.disabled = false;
    render();
  });

  const openBulkPersonBtn = app.querySelector('[data-action="openBulkPersonModal"]');
  if(openBulkPersonBtn) openBulkPersonBtn.addEventListener('click', ()=>{
    state.bulkPersonModal = true;
    state.bulkRows = [0,1,2].map(()=>({name:'', role:'intern', title:'', username:'', password:'', email:''}));
    state.bulkResult = null;
    render();
  });
  const bulkAddRowBtn = app.querySelector('[data-action="bulkAddRow"]');
  if(bulkAddRowBtn) bulkAddRowBtn.addEventListener('click', ()=>{
    state.bulkRows.push({name:'', role:'intern', title:'', username:'', password:'', email:''});
    render();
  });
  app.querySelectorAll('[data-bulkremove]').forEach(b=>b.addEventListener('click', ()=>{
    const idx = Number(b.dataset.bulkremove);
    state.bulkRows.splice(idx,1);
    if(!state.bulkRows.length) state.bulkRows.push({name:'', role:'intern', title:'', username:'', password:'', email:''});
    render();
  }));
  app.querySelectorAll('[data-bulkfield]').forEach(el=>{
    const evt = el.tagName==='SELECT' ? 'change' : 'input';
    el.addEventListener(evt, ()=>{
      const idx = Number(el.dataset.bulkidx), field = el.dataset.bulkfield;
      if(state.bulkRows[idx]) state.bulkRows[idx][field] = el.value;
      render();
      if(evt==='input') restoreFocus(el.id);
    });
  });
  const bulkPersonForm = document.getElementById('bulkPersonForm');
  if(bulkPersonForm) bulkPersonForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const btn = bulkPersonForm.querySelector('button[type="submit"]');
    if(btn) btn.disabled = true;
    const remaining = [];
    const errors = [];
    let successCount = 0;
    for(const r of state.bulkRows){
      const blank = !r.name.trim() && !r.username.trim() && !r.password.trim();
      if(blank) continue;
      if(!r.name.trim() || !r.username.trim() || !r.password.trim()){
        errors.push(`"${r.name.trim()||r.username.trim()||'(dòng thiếu thông tin)'}": cần đủ Họ tên, Tài khoản và Mật khẩu.`);
        remaining.push(r);
        continue;
      }
      try{
        await callFn('create-team-member', { name:r.name.trim(), role:r.role, title:r.title.trim(), username:r.username.trim(), password:r.password, email:(r.email||'').trim() });
        successCount++;
      }catch(err){
        errors.push(`"${r.name.trim()}" (${r.username.trim()}): ${err.message||err}`);
        remaining.push(r);
      }
    }
    state.bulkRows = remaining.length ? remaining : [{name:'', role:'intern', title:'', username:'', password:'', email:''}];
    state.bulkResult = { successCount, errors };
    if(errors.length===0 && successCount>0){ state.bulkPersonModal=false; state.bulkResult=null; }
    if(btn) btn.disabled = false;
    render();
  });

  const emptyBulkTaskRow = ()=>({keyword:'', type:'New', assignee:'', deadline: defaultDeadline(), desc:'', _rawName:''});
  const openBulkTaskBtn = app.querySelector('[data-action="openBulkTaskModal"]');
  if(openBulkTaskBtn) openBulkTaskBtn.addEventListener('click', ()=>{
    state.bulkTaskModal = true;
    state.bulkTaskRows = [0,1,2].map(emptyBulkTaskRow);
    state.bulkTaskPaste = '';
    state.bulkTaskResult = null;
    render();
  });
  const bulkTaskAddRowBtn = app.querySelector('[data-action="bulkTaskAddRow"]');
  if(bulkTaskAddRowBtn) bulkTaskAddRowBtn.addEventListener('click', ()=>{
    state.bulkTaskRows.push(emptyBulkTaskRow());
    render();
  });
  app.querySelectorAll('[data-bulktaskremove]').forEach(b=>b.addEventListener('click', ()=>{
    const idx = Number(b.dataset.bulktaskremove);
    state.bulkTaskRows.splice(idx,1);
    if(!state.bulkTaskRows.length) state.bulkTaskRows.push(emptyBulkTaskRow());
    render();
  }));
  app.querySelectorAll('[data-btfield]').forEach(el=>{
    const evt = el.tagName==='SELECT' ? 'change' : 'input';
    el.addEventListener(evt, ()=>{
      const idx = Number(el.dataset.btidx), field = el.dataset.btfield;
      if(state.bulkTaskRows[idx]){
        state.bulkTaskRows[idx][field] = el.value;
        if(field==='assignee') state.bulkTaskRows[idx]._rawName = '';
      }
      render();
      if(evt==='input') restoreFocus(el.id);
    });
  });
  const bulkTaskPasteEl = document.getElementById('bulkTaskPaste');
  if(bulkTaskPasteEl) bulkTaskPasteEl.addEventListener('input', ()=>{ state.bulkTaskPaste = bulkTaskPasteEl.value; });
  const parseBulkTaskBtn = app.querySelector('[data-action="parseBulkTaskPaste"]');
  if(parseBulkTaskBtn) parseBulkTaskBtn.addEventListener('click', ()=>{
    const raw = (document.getElementById('bulkTaskPaste')?.value || '').trim();
    if(!raw) return;
    const allPeople = USERS.slice();
    const findPerson = (name)=>{
      const n = (name||'').trim().toLowerCase();
      if(!n) return null;
      return allPeople.find(p=>p.name.trim().toLowerCase()===n) || null;
    };
    const findType = (label)=>{
      const l = (label||'').trim().toLowerCase();
      if(!l) return 'New';
      const hit = TYPE_ORDER.find(t=>t.toLowerCase()===l || TYPE_META[t].label.toLowerCase()===l);
      return hit || 'New';
    };
    const parseDeadline = (s)=>{
      const v = (s||'').trim();
      let m = v.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/); // dd/mm/yyyy
      if(m) return `${m[3]}-${pad2(m[2])}-${pad2(m[1])}`;
      m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); // yyyy-mm-dd (đã đúng định dạng)
      if(m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
      return '';
    };
    const lines = raw.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    const parsed = lines.map(line=>{
      const cols = (line.includes('\t') ? line.split('\t') : line.split('|')).map(c=>c.trim());
      const [keyword='', typeRaw='', nameRaw='', deadlineRaw='', desc=''] = cols;
      const person = findPerson(nameRaw);
      return {
        keyword,
        type: findType(typeRaw),
        assignee: person ? person.id : '',
        _rawName: person ? '' : nameRaw,
        deadline: parseDeadline(deadlineRaw) || defaultDeadline(),
        desc,
      };
    });
    state.bulkTaskRows = parsed.length ? parsed : state.bulkTaskRows;
    render();
  });
  const submitBulkTaskBtn = app.querySelector('[data-action="submitBulkTask"]');
  if(submitBulkTaskBtn) submitBulkTaskBtn.addEventListener('click', async ()=>{
    submitBulkTaskBtn.disabled = true;
    const remaining = [];
    const errors = [];
    let successCount = 0;
    for(const r of state.bulkTaskRows){
      const blank = !r.keyword.trim() && !r.assignee && !r._rawName;
      if(blank) continue;
      if(!r.keyword.trim() || !r.assignee || !r.deadline){
        errors.push(`"${r.keyword.trim()||r._rawName||'(dòng thiếu thông tin)'}": cần đủ Từ khoá, Nhân sự thực hiện và Deadline.`);
        remaining.push(r);
        continue;
      }
      try{
        await dbApi.collection('tasks').add({
          keyword: r.keyword.trim(),
          type: r.type || 'New',
          assignee: r.assignee, assignedBy: state.authedUser.id,
          deadline: r.deadline,
          createdAt: todayISO(), status:'assigned', fileLink:'',
          desc: r.desc.trim() || '(không có mô tả thêm)',
          history:[{t:todayDMY(), text: r.assignee===state.authedUser.id ? 'Tự tạo task cho bản thân' : `Giao việc cho ${byId(r.assignee).name}`}],
          comments:[],
        });
        successCount++;
      }catch(err){
        errors.push(`"${r.keyword.trim()}": ${err.message||err}`);
        remaining.push(r);
      }
    }
    state.bulkTaskRows = remaining.length ? remaining : [emptyBulkTaskRow()];
    state.bulkTaskResult = { successCount, errors };
    if(errors.length===0 && successCount>0){ state.bulkTaskModal=false; state.bulkTaskResult=null; state.bulkTaskPaste=''; }
    submitBulkTaskBtn.disabled = false;
    render();
  });

  /* generic close handlers for the small modals */
  const closeActionMap = {
    closeSubmitModal: ()=>state.submitModal=null,
    closeFixModal: ()=>state.fixModal=null,
    closeConfirmModal: ()=>state.confirmModal=null,
    closeCalDayModal: ()=>{ const cd=state.calDayModal; state.calDayModal=null; if(cd && cd.fromView) state.calDayViewModal={date:cd.date}; },
    closeCalDayViewModal: ()=>state.calDayViewModal=null,
    closePersonModal: ()=>state.personModal=false,
    closeEditPersonModal: ()=>state.editPersonModal=null,
    closeResetPwModal: ()=>state.resetPwModal=null,
    closeBulkPersonModal: ()=>state.bulkPersonModal=false,
    closeBulkTaskModal: ()=>state.bulkTaskModal=false,
  };
  Object.keys(closeActionMap).forEach(name=>{
    app.querySelectorAll(`[data-action="${name}"]`).forEach(b=>b.addEventListener('click', ()=>{ closeActionMap[name](); render(); }));
  });
  const closeBgMap = {
    submitmodal: ()=>state.submitModal=null,
    fixmodal: ()=>state.fixModal=null,
    confirmmodal: ()=>state.confirmModal=null,
    caldaymodal: ()=>{ const cd=state.calDayModal; state.calDayModal=null; if(cd && cd.fromView) state.calDayViewModal={date:cd.date}; },
    caldayviewmodal: ()=>state.calDayViewModal=null,
    personmodal: ()=>state.personModal=false,
    editpersonmodal: ()=>state.editPersonModal=null,
    resetpwmodal: ()=>state.resetPwModal=null,
    bulkpersonmodal: ()=>state.bulkPersonModal=false,
    bulktaskmodal: ()=>state.bulkTaskModal=false,
  };
  Object.keys(closeBgMap).forEach(key=>{
    app.querySelectorAll(`[data-close="${key}"]`).forEach(bg=>bg.addEventListener('click', (e)=>{ if(e.target===bg){ closeBgMap[key](); render(); } }));
  });
}
function restoreFocus(id){ const el=document.getElementById(id); if(el){ el.focus(); const v=el.value; el.value=''; el.value=v; } }

/* ============================= GLOBAL: close notification bell on outside click ============================= */
document.addEventListener('click', (e)=>{
  if(state.notifOpen && !e.target.closest('.bell-wrap')){ state.notifOpen = false; render(); }
});

/* ============================= POLLEN CLICK EFFECT ============================= */
(function setupPollenEffect(){
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduceMotion) return;
  document.addEventListener('click', function(e){
    const count = 6 + Math.floor(Math.random()*5);
    for(let i=0;i<count;i++){
      const p = document.createElement('span');
      p.className = 'pollen-particle';
      const angle = Math.random()*Math.PI*2;
      const dist = 26 + Math.random()*54;
      const dx = Math.cos(angle)*dist;
      const dy = Math.sin(angle)*dist - 12;
      const size = 3.5 + Math.random()*5;
      const dur = 0.5 + Math.random()*0.4;
      p.style.left = e.clientX+'px';
      p.style.top = e.clientY+'px';
      p.style.width = size+'px';
      p.style.height = size+'px';
      p.style.setProperty('--dx', dx.toFixed(1)+'px');
      p.style.setProperty('--dy', dy.toFixed(1)+'px');
      p.style.setProperty('--rot', (Math.random()*140-70).toFixed(0)+'deg');
      p.style.animationDuration = dur+'s';
      document.body.appendChild(p);
      p.addEventListener('animationend', function(){ p.remove(); });
      setTimeout(function(){ if(p.parentNode) p.remove(); }, (dur*1000)+200);
    }
  }, true);
})();

render();
initApp();
</script>
